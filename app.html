  // '' = default (uses the app accent). Others are tile accent colours.
  const PALETTE = ['', '#C75B12','#2f9e5f','#0A66C2','#7A5AF8','#E4405F','#d99512','#0f766e','#334155'];
  const CHANNELS = [['all','All channels'],['facebook','Facebook'],['instagram','Instagram'],['whatsapp','WhatsApp'],['email','Email'],['linkedin','LinkedIn']];
  // WMO weather codes -> [label, emoji]
  const WMO = {0:['Clear sky','☀️'],1:['Mainly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Rime fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌦️'],56:['Freezing drizzle','🌧️'],57:['Freezing drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],66:['Freezing rain','🌧️'],67:['Freezing rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],77:['Snow grains','🌨️'],80:['Rain showers','🌦️'],81:['Rain showers','🌧️'],82:['Violent showers','⛈️'],85:['Snow showers','🌨️'],86:['Snow showers','🌨️'],95:['Thunderstorm','⛈️'],96:['Thunderstorm + hail','⛈️'],99:['Thunderstorm + hail','⛈️']};
  const COMMON_TZ = [['Cape Town','Africa/Johannesburg'],['London','Europe/London'],['New York','America/New_York'],['Los Angeles','America/Los_Angeles'],['Chicago','America/Chicago'],['Toronto','America/Toronto'],['São Paulo','America/Sao_Paulo'],['Dubai','Asia/Dubai'],['Mumbai','Asia/Kolkata'],['Singapore','Asia/Singapore'],['Hong Kong','Asia/Hong_Kong'],['Tokyo','Asia/Tokyo'],['Sydney','Australia/Sydney'],['Paris','Europe/Paris'],['Berlin','Europe/Berlin'],['Nairobi','Africa/Nairobi'],['Lagos','Africa/Lagos'],['Auckland','Pacific/Auckland']];
  const QUOTES = [
    ['Content builds relationships. Relationships build trust. Trust drives revenue.','Andrew Davis'],
    ['Marketing is no longer about the stuff you make, but the stories you tell.','Seth Godin'],
    ['Done is better than perfect.','Sheryl Sandberg'],
    ['The best marketing doesn’t feel like marketing.','Tom Fishburne'],
    ['People don’t buy what you do; they buy why you do it.','Simon Sinek'],
    ['Make it simple. Make it memorable. Make it inviting to look at.','Leo Burnett'],
    ['Either write something worth reading or do something worth writing about.','Benjamin Franklin'],
    ['You can’t use up creativity. The more you use, the more you have.','Maya Angelou'],
    ['Focus on the value you deliver, not the noise you make.','—'],
    ['Consistency is more important than intensity.','—'],
    ['Your brand is what people say about you when you’re not in the room.','Jeff Bezos'],
    ['Start where you are. Use what you have. Do what you can.','Arthur Ashe'],
    ['A goal without a deadline is just a dream.','—'],
    ['Ship it, then improve it.','—'],
    ['The riches are in the niches.','—'],
    ['Quality means doing it right when no one is looking.','Henry Ford'],
    ['Great things are done by a series of small things brought together.','Vincent van Gogh'],
    ['Don’t find customers for your products, find products for your customers.','Seth Godin'],
    ['Attention is the new currency — earn it, don’t buy it.','—'],
    ['Small daily improvements are the key to staggering long-term results.','—']
  ];
  const DEFAULT_LAYOUT = [
    {type:'goal', cfg:{label:'Revenue this month', mode:'auto', source:'revenue', board:'all', target:60000, deadline:''}, x:0,y:0,w:4,h:3},
    {type:'goal', cfg:{label:'Grow followers', mode:'auto', source:'followers', board:'all', target:10000, deadline:''}, x:4,y:0,w:4,h:3},
    {type:'todos', cfg:{}, x:8,y:0,w:4,h:5},
    {type:'analytics', cfg:{platform:'all', board:'all'}, x:0,y:3,w:5,h:5},
    {type:'calendar', cfg:{source:'internal'}, x:5,y:3,w:3,h:5},
    {type:'posts', cfg:{}, x:8,y:5,w:4,h:4},
    {type:'inbox', cfg:{board:'all', channel:'all'}, x:0,y:8,w:5,h:3},
    {type:'boards', cfg:{}, x:5,y:8,w:7,h:4}
  ];

  /* ---------- state ---------- */
  let layout = null;      // array of {id,type,cfg,x,y,w,h}
  let grid = null;
  let editing = false;
  let seq = 1;
  let dataReady = false;
  let saveT = null;
  const EMPTY_M = { reach:0, followers:0, engRate:0, plats:[], spark:[], delta:null };
  const D = { all:Object.assign({},EMPTY_M), by:{}, revAll:0, revBy:{}, postAll:0, postBy:{}, inbox:[] };
  function mSrc(board){ return (board&&board!=='all') ? (D.by[board]||EMPTY_M) : D.all; }
  function mVal(metric, board){
    if(metric==='revenue') return (board&&board!=='all') ? (D.revBy[board]||0) : D.revAll;
    if(metric==='posts')   return (board&&board!=='all') ? (D.postBy[board]||0) : D.postAll;
    const s=mSrc(board);
    if(metric==='followers') return s.followers||0;
    if(metric==='reach') return s.reach||0;
    if(metric==='engagement') return s.engRate||0;
    return 0;
  }

  /* ============ DATA ============ */
  async function loadData(){
    dataReady=false;
    try{
      // reuse the app's own home loader to populate _home {tasks,inbox,posts,docs,today}
      if(typeof loadHome!=='undefined') await loadHome();
    }catch(_e){}
    const boardIds=BRDS().map(b=>b.id);
    try{
      const monthStart=saD().slice(0,8)+'01';
      const P0=Promise.resolve({data:[]});
      const [inv, posted, metrics, inbox] = await Promise.all([
        boardIds.length? sb.from('bbe_invoices').select('amount,kind,paid,created_at,board_id').in('board_id',boardIds).eq('kind','in').eq('paid',true).gte('created_at',monthStart) : P0,
        boardIds.length? sb.from('bbe_posts').select('id,status,post_date,board_id').eq('workspace_id',WS.id).eq('status','posted').gte('post_date',monthStart) : P0,
        boardIds.length? sb.from('bbe_metrics').select('board_id,source,metric,value,captured_for').in('board_id',boardIds).gte('captured_for',new Date(Date.now()-60*864e5).toISOString().slice(0,10)).order('captured_for') : P0,
        boardIds.length? sb.from('bbe_interactions').select('*').in('board_id',boardIds).order('received_at',{ascending:false}).limit(60) : P0
      ]);
      // revenue per board + total
      D.revAll=0; D.revBy={};
      (inv.data||[]).forEach(x=>{ const a=Number(x.amount)||0; D.revAll+=a; D.revBy[x.board_id]=(D.revBy[x.board_id]||0)+a; });
      // posts published per board + total
      D.postAll=0; D.postBy={};
      (posted.data||[]).forEach(x=>{ D.postAll++; D.postBy[x.board_id]=(D.postBy[x.board_id]||0)+1; });
      // metrics: combined + per board
      const rows=metrics.data||[];
      D.all=computeMetrics(rows);
      D.by={};
      boardIds.forEach(bid=>{ const sub=rows.filter(r=>r.board_id===bid); if(sub.length) D.by[bid]=computeMetrics(sub); });
      // inbox (broad set for per-board / per-channel filtering)
      D.inbox=inbox.data||[];
    }catch(e){ console.error('dash data',e); }
    dataReady=true;
    refreshAllBodies();
  }
  function computeMetrics(rows){
    const SRCMAP={tiktok:'tiktok',instagram:'instagram',facebook:'facebook',youtube:'youtube',threads:'threads',social:'linkedin',linkedin:'linkedin',pinterest:'pinterest',twitter:'twitter'};
    const days=[]; for(let i=29;i>=0;i--) days.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10));
    const series={};
    for(const r of rows){ const k=r.board_id+'|'+r.source+'|'+r.metric; (series[k]=series[k]||[]).push({d:r.captured_for,v:Number(r.value)||0}); }
    const latest=a=>a&&a.length? a[a.length-1].v : 0;
    const at=(a,day)=>{ if(!a)return 0; let v=0; for(const p of a){ if(p.d<=day)v=p.v; } return v; };
    const bySource={}; let followers=0, likes=0, comments=0, shares=0, reachTot=0;
    const reachSeries=days.map(()=>0);
    Object.keys(series).forEach(k=>{
      const [board,src,metric]=k.split('|'); const key=SRCMAP[src]||src; const a=series[k];
      if(metric==='reach'){ const lv=latest(a); reachTot+=lv; bySource[key]=(bySource[key]||0)+lv; days.forEach((d,i)=>{ reachSeries[i]+=at(a,d); }); }
      else if(metric==='followers_count') followers+=latest(a);
      else if(metric==='likes') likes+=latest(a);
      else if(metric==='comments') comments+=latest(a);
      else if(metric==='shares') shares+=latest(a);
    });
    // views fallback: sources with no reach contribute views to the platform bar + total
    const viewsBy={};
    Object.keys(series).forEach(k=>{ const [board,src,metric]=k.split('|'); const key=SRCMAP[src]||src; if(metric==='views'){ viewsBy[key]=(viewsBy[key]||0)+latest(series[k]); } });
    Object.keys(viewsBy).forEach(key=>{ if(!bySource[key]){ bySource[key]=viewsBy[key]; reachTot+=viewsBy[key]; } });
    const first=reachSeries.find(v=>v>0)||0, last=reachSeries[reachSeries.length-1]||0;
    return {
      reach:reachTot, followers,
      engRate: reachTot>0 ? ((likes+comments+shares)/reachTot*100) : 0,
      spark:reachSeries,
      delta: first>0 ? Math.round((last-first)/first*100) : null,
      plats:Object.entries(bySource).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1])
    };
  }

  /* ============ WIDGET BODIES ============ */
  function ring(pct,inner){
    const r=26,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(pct,1)));
    return `<div class="dw-ring"><svg width="66" height="66" viewBox="0 0 66 66">
      <circle cx="33" cy="33" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/>
      <circle cx="33" cy="33" r="${r}" fill="none" stroke="var(--wc, var(--accent))" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 33 33)"/>
    </svg><div class="dw-rv">${inner}</div></div>`;
  }
  function spark(arr,h){ h=h||42; arr=(arr||[]).map(Number);
    if(arr.length<2||Math.max(...arr)<=0) return `<div class="dw-mute" style="margin-top:8px">Trend builds up over the next few days.</div>`;
    const w=220,mn=Math.min(...arr),mx=Math.max(...arr),rng=(mx-mn)||1;
    const pts=arr.map((v,i)=>[i/(arr.length-1)*w, h-5-((v-mn)/rng)*(h-10)]);
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;margin-top:8px">
      <path d="${d} L${w} ${h} L0 ${h} Z" fill="var(--wc, var(--accent))" opacity="0.08"/>
      <path d="${d}" fill="none" stroke="var(--wc, var(--accent))" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  function boardName(id){ const b=BRDS().find(x=>x.id===id); return b?b.name:'board'; }
  function goalBody(cfg){
    let cur, target=Number(cfg.target)||0, fmt=numF;
    const board=cfg.board||'all';
    if(cfg.mode==='auto'){ const s=GOAL_SRC[cfg.source]||GOAL_SRC.reach; cur=dataReady? mVal(s.metric, board):0; fmt=s.fmt; }
    else { cur=Number(cfg.current)||0; const u=cfg.unit||''; fmt=n=> u==='R'? money(n) : (numF(n)+(u&&u!=='R'?' '+u:'')); }
    const pct= target>0? cur/target : 0;
    const scope= cfg.mode==='auto' ? (board==='all'?'All boards':E(boardName(board))) : '';
    const srcPill= cfg.mode==='auto'
      ? `<span class="dw-pill link">● ${E((GOAL_SRC[cfg.source]||{}).label||'')}${scope?' · '+scope:''}</span>`
      : `<span class="dw-pill manual">Manual</span>`;
    let due='';
    if(cfg.deadline){ const days=Math.ceil((new Date(cfg.deadline+'T00:00:00')-new Date(saD()+'T00:00:00'))/864e5); if(!isNaN(days)) due=`<span class="dw-pill due">⏳ ${days<0?'past due':days+'d left'}</span>`; }
    const loading = (cfg.mode==='auto'&&!dataReady)?' style="opacity:.5"':'';
    return `<div class="dw-goal"${loading}>
      ${ring(pct, `<b>${Math.round(pct*100)}%</b><small>of goal</small>`)}
      <div class="dw-gmeta">
        <div class="dw-glab">${E(cfg.label||'My goal')}</div>
        <div class="dw-gnum">${fmt(cur)} <s>/ ${fmt(target)}</s></div>
        <div class="dw-gbar"><i style="width:${Math.min(100,pct*100)}%"></i></div>
        <div class="dw-gsub">${srcPill}${due}</div>
      </div></div>`;
  }
  function analyticsBody(cfg){
    if(!dataReady) return `<div class="dw-mute" style="padding:10px 0">Loading metrics…</div>`;
    const plat=cfg.platform||'all';
    const board=cfg.board||'all';
    const m=mSrc(board);
    const scope = board==='all' ? 'all boards' : E(boardName(board));
    if(plat==='all'){
      if(!m.reach) return `<div class="dw-mute" style="padding:10px 0">No metrics yet for ${scope}. Connect an account on the Content tab and analytics start flowing here.</div>`;
      const mx=m.plats.length?m.plats[0][1]:1;
      const bars=m.plats.map(([k,v])=>{ const p=PLATS()[k]||['?','#8a887e']; return `<div class="dw-brow"><span class="dw-bn"><span class="dw-dot" style="background:${p[1]}"></span>${E(p[0])}</span><span class="dw-bar"><i style="width:${v/mx*100}%;background:${p[1]}"></i></span><span class="dw-bv">${num(v)}</span></div>`; }).join('');
      const dd = m.delta==null?'':`<span class="dw-delta ${m.delta>=0?'up':'down'}">${m.delta>=0?'▲':'▼'} ${Math.abs(m.delta)}%</span>`;
      return `<div class="dw-cap">Total reach · ${scope} · 30d</div><div class="dw-big">${numF(m.reach)}</div>${dd?'<div style="margin-top:2px">'+dd+'</div>':''}${spark(m.spark)}<div class="dw-bars">${bars}</div>`;
    } else {
      const v=(m.plats.find(x=>x[0]===plat)||[,0])[1];
      const p=PLATS()[plat]||['?','#8a887e'];
      return `<div class="dw-cap"><span class="dw-dot" style="background:${p[1]}"></span>${E(p[0])} reach · ${scope} · 30d</div><div class="dw-big">${numF(v)}</div>${spark(m.spark)}`;
    }
  }
  function calBody(cfg){
    if(cfg.source==='external'){
      if(_dashCal.state==='loading'){ if(!_dashCal.started) dashCalLoad(); return `<div class="dw-srcbadge">🔗 My calendar</div><div class="dw-mute" style="padding:10px 0">Loading your calendar…</div>`; }
      if(_dashCal.state==='disconnected'){
        return `<div class="dw-srcbadge">🔗 My calendar</div>
          <div class="dw-connect">
            <p class="dw-mute">Connect your Google calendar to see your real meetings here.</p>
            <button class="btn accent" onclick="dashCalConnect()">Connect Google Calendar</button>
          </div>`;
      }
      // connected
      const evs=_dashCal.events||[];
      const head=`<div class="dw-srcbadge" title="${E(_dashCal.email||'')}">🔗 ${E(_dashCal.email||'Google Calendar')} <a href="#" onclick="dashCalDisconnect();return false" style="color:var(--muted);margin-left:6px">disconnect</a></div>`;
      if(!evs.length) return head+`<div class="dw-mute" style="padding:10px 0">No meetings in the next 3 weeks.</div>`;
      const rows=evs.map(x=>{ const dstr=x.date; const dt=dstr?new Date((x.dateTime||dstr)):null; const dd=dt&&!isNaN(dt)?dt.getDate():'—'; const mo=dt&&!isNaN(dt)?dt.toLocaleDateString('en-ZA',{month:'short'}):''; const tm=x.allDay?'All day':(dt&&!isNaN(dt)?dt.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}):''); const sub=[tm,x.where].filter(Boolean).join(' · ');
        return `<div class="dw-ag" onclick="${x.link?`window.open('${x.link}','_blank')`:''}"><div class="dw-when"><b>${dd}</b><small>${mo}</small></div><div class="dw-what"><div class="t">${E(x.title)}</div><div class="m">${E(sub)}</div></div></div>`;
      }).join('');
      return head+rows;
    }
    const home=HOME();
    const posts=(home.posts||[]).map(p=>({date:p.post_date,label:(p.caption||'').split('\n')[0]||'(no caption)',sub:(PLATS()[p.platform]||PLATS().other||['',''])[0]+' · scheduled',bid:p.board_id}));
    const tasks=(home.tasks||[]).map(n=>({date:n.due_date,label:n.title||'Task due',sub:'Deadline',bid:n.board_id}));

    if(!items.length) return `<div class="dw-srcbadge">📅 Content schedule</div><div class="dw-mute" style="padding:10px 0">Nothing scheduled yet.</div>`;
    const rows=items.map(x=>{ const dt=new Date(x.date+'T00:00:00'); const dd=isNaN(dt)?'—':dt.getDate(); const mo=isNaN(dt)?'':dt.toLocaleDateString('en-ZA',{month:'short'});
      return `<div class="dw-ag" onclick="${x.bid?`openBoardView('${x.bid}','content')`:''}"><div class="dw-when"><b>${dd}</b><small>${mo}</small></div><div class="dw-what"><div class="t">${E(x.label)}</div><div class="m">${E(x.sub)}</div></div></div>`;
    }).join('');
    return `<div class="dw-srcbadge">📅 Content schedule</div>${rows}`;
  }

    // ensure ids + seq
    layout.forEach(w=>{ if(!w.id) w.id='w'+(seq++); const n=parseInt((w.id||'').replace('w',''),10); if(!isNaN(n)&&n>=seq) seq=n+1; });

  window.dashTidy=function(){
    if(!grid||!(layout&&layout.length)) return;
    syncPositions();
    const COLS=12;
    // keep current reading order (top-to-bottom, left-to-right), then gravity-pack
    const ws=(layout||[]).slice().sort((a,b)=> ((a.y||0)-(b.y||0)) || ((a.x||0)-(b.x||0)) );
    const occ=[];
    const row=r=>{ occ[r]=occ[r]||new Array(COLS).fill(false); return occ[r]; };
    const fits=(x,y,w,h)=>{ for(let r=y;r<y+h;r++){ const rr=row(r); for(let c=x;c<x+w;c++){ if(rr[c]) return false; } } return true; };
    const mark=(x,y,w,h)=>{ for(let r=y;r<y+h;r++){ const rr=row(r); for(let c=x;c<x+w;c++) rr[c]=true; } };
    try{ grid.batchUpdate(); }catch(_e){}
    ws.forEach(w=>{
      const wd=Math.min(w.w||1,COLS), ht=w.h||1;
      let done=false;
      for(let y=0; !done && y<2000; y++){
        for(let x=0; x+wd<=COLS; x++){
          if(fits(x,y,wd,ht)){ w.x=x; w.y=y; w.w=wd; w.h=ht; mark(x,y,wd,ht);
            const el=document.querySelector('.dw[data-id="'+w.id+'"]'); if(el){ const item=el.closest('.grid-stack-item'); try{ grid.update(item,{x:x,y:y,w:wd,h:ht}); }catch(_e){} }
            done=true; break; }
        }
      }
    });
    try{ grid.commit(); }catch(_e){}
    save(); dtoast('Widgets tidied up');
  };

  /* ---- external calendar (Google) ---- */
  const _dashCal={ state:'loading', started:false, events:[], email:null };
  function calFnUrl(){ return (typeof SUPABASE_URL!=='undefined'?SUPABASE_URL:'')+'/functions/v1/bbe-calendar'; }
  async function calPost(action, extra){
    const { data:{ session } }=await sb.auth.getSession();
    const jwt=session?.access_token||'';
    const anon=(typeof SUPABASE_KEY!=='undefined')?SUPABASE_KEY:'';
    const r=await fetch(calFnUrl(), { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':anon, 'Authorization':'Bearer '+jwt }, body:JSON.stringify(Object.assign({action, workspace_id:WS.id}, extra||{})) });
    return await r.json();
  }
  function refreshCalWidgets(){ (layout||[]).filter(w=>w.type==='calendar'&&w.cfg.source==='external').forEach(refreshBody); }
  async function dashCalLoad(){
    if(_dashCal.started) return; _dashCal.started=true; _dashCal.state='loading';
    try{
      const j=await calPost('list');
      if(j&&j.connected){ _dashCal.state='connected'; _dashCal.events=j.events||[]; _dashCal.email=j.email||null; }
      else { _dashCal.state='disconnected'; _dashCal.events=[]; }
    }catch(_e){ _dashCal.state='disconnected'; }
    refreshCalWidgets();
  }
  window.dashCalConnect=async function(){
    dtoast('Opening Google…');
    try{ const j=await calPost('connect'); if(j&&j.url){ location.href=j.url; } else { dtoast(j&&j.error?j.error:'Could not start calendar connect.'); } }
    catch(_e){ dtoast('Could not start calendar connect.'); }
  };
  window.dashCalDisconnect=async function(){
    try{ await calPost('disconnect'); }catch(_e){}
    _dashCal.state='disconnected'; _dashCal.events=[]; _dashCal.email=null; refreshCalWidgets(); dtoast('Calendar disconnected');
  };
  // handle return from Google OAuth (?calconnected=1|err)
  try{
    const q=new URLSearchParams(location.search);
    if(q.has('calconnected')){
      const ok=q.get('calconnected')==='1';
      setTimeout(()=>dtoast(ok?'✅ Calendar connected':'Calendar connect failed — please try again'),600);
      // reset so the widget re-fetches fresh state
      _dashCal.started=false; _dashCal.state='loading';
      q.delete('calconnected');
      const clean=location.pathname+(q.toString()?('?'+q.toString()):'')+location.hash;
      history.replaceState(null,'',clean);
    }
  }catch(_e){}

  /* ---- website + search analytics (Google GA4 + Search Console), per board ---- */
  const _dashWeb={}; // boardId -> {state,email,ga4,ga4name,ga4sel,scsel,ga4List,siteList,sc,started}
  function webUrl(){ return (typeof SUPABASE_URL!=='undefined'?SUPABASE_URL:'')+'/functions/v1/bbe-web'; }
  async function webPost(action, board, extra){
    const { data:{ session } }=await sb.auth.getSession();
    const jwt=session?.access_token||''; const anon=(typeof SUPABASE_KEY!=='undefined')?SUPABASE_KEY:'';
    const r=await fetch(webUrl(), { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':anon, 'Authorization':'Bearer '+jwt }, body:JSON.stringify(Object.assign({action, workspace_id:WS.id, board_id:board}, extra||{})) });
    return await r.json();
  }
  function webBoardOf(cfg){ return (cfg&&cfg.board)||((BRDS()[0]||{}).id); }
  function refreshWebWidgets(board){ (layout||[]).filter(w=>(w.type==='website'||w.type==='search')&&webBoardOf(w.cfg)===board).forEach(refreshBody); }
  async function webLoad(board){
    const cur=_dashWeb[board]; if(cur&&cur.started) return;
    _dashWeb[board]={state:'loading',started:true};
    try{
      const st=await webPost('status',board);
      if(!st||!st.connected){ _dashWeb[board]={state:'disconnected',started:true}; refreshWebWidgets(board); return; }
      const rec={state:'ready',started:true,email:st.email,ga4sel:st.ga4_property_id,ga4name:st.ga4_property_name,scsel:st.sc_site_url,ga4:null,sc:null,ga4List:null,siteList:null};
      if(!st.ga4_property_id || !st.sc_site_url){ try{ const l=await webPost('list',board); if(l&&l.connected){ rec.ga4List=l.ga4||[]; rec.siteList=l.sites||[]; } }catch(_e){} }
      if(st.ga4_property_id || st.sc_site_url){ try{ const s=await webPost('stats',board); if(s&&s.connected){ rec.ga4=s.ga4||null; rec.sc=s.sc||null; } }catch(_e){} }
      _dashWeb[board]=rec;
    }catch(_e){ _dashWeb[board]={state:'disconnected',started:true}; }

  }
  window.dashWebConnect=async function(board){ dtoast('Opening Google…'); try{ const j=await webPost('connect',board); if(j&&j.url) location.href=j.url; else dtoast(j&&j.error?j.error:'Could not start.'); }catch(_e){ dtoast('Could not start.'); } };
  window.dashWebDisconnect=async function(board){ try{ await webPost('disconnect',board); }catch(_e){} _dashWeb[board]={state:'disconnected',started:true}; refreshWebWidgets(board); dtoast('Disconnected'); };
  window.dashWebPickGa4=async function(board,pid,name){ if(!pid)return; try{ await webPost('select',board,{ga4_property_id:pid,ga4_property_name:name}); }catch(_e){} delete _dashWeb[board]; webLoad(board); dtoast('Analytics property linked'); };
  window.dashWebPickSite=async function(board,site){ if(!site)return; try{ await webPost('select',board,{sc_site_url:site}); }catch(_e){} delete _dashWeb[board]; webLoad(board); dtoast('Search Console site linked'); };
  function webConnectPrompt(board,label){
    return `<div class="dw-srcbadge">${label} · ${E(boardName(board))}</div>
      <div class="dw-connect"><p class="dw-mute">Connect Google Analytics &amp; Search Console for this board to see its website numbers.</p>
      <button class="btn accent" onclick="dashWebConnect('${board}')">Connect Google</button></div>`;
  }
  function websiteBody(cfg){
    const board=webBoardOf(cfg);
    if(!board) return `<div class="dw-mute" style="padding:10px 0">No boards yet.</div>`;
    const w=_dashWeb[board];
    if(!w||w.state==='loading'){ webLoad(board); return `<div class="dw-srcbadge">🌐 Website</div><div class="dw-mute" style="padding:10px 0">Loading…</div>`; }
    if(w.state==='disconnected') return webConnectPrompt(board,'🌐 Website');
    if(!w.ga4sel){ // need to pick GA4 property
      const opts=(w.ga4List||[]).map(p=>`<option value="${E(p.property)}">${E(p.name)}</option>`).join('');
      if(!opts) return `<div class="dw-srcbadge">🌐 Website</div><div class="dw-mute" style="padding:10px 0">No GA4 property on ${E(w.email||'this account')}. <a href="#" onclick="dashWebDisconnect('${board}');return false">Reconnect</a></div>`;
      return `<div class="dw-srcbadge">🌐 Pick a GA4 property</div><div class="dw-fld" style="margin-top:8px"><select onchange="dashWebPickGa4('${board}',this.value,this.options[this.selectedIndex].text)"><option value="">Choose property…</option>${opts}</select></div>`;
    }
    const g=w.ga4;
    if(!g) return `<div class="dw-srcbadge">🌐 ${E(w.ga4name||boardName(board))}</div><div class="dw-mute" style="padding:10px 0">No traffic data in the last 30 days.</div>`;
    const chMax=(g.channels&&g.channels[0]?g.channels[0].sessions:1)||1;
    const bars=(g.channels||[]).map(c=>`<div class="dw-brow"><span class="dw-bn">${E(c.name||'—')}</span><span class="dw-bar"><i style="width:${c.sessions/chMax*100}%;background:var(--wc,var(--accent))"></i></span><span class="dw-bv">${num(c.sessions)}</span></div>`).join('');

  function relTime(dt){
    if(!(dt instanceof Date)||isNaN(dt)) return '';
    const s=Math.floor((Date.now()-dt.getTime())/1000);
    if(s<0){ const f=-s; if(f<3600)return 'in '+Math.max(1,Math.ceil(f/60))+'m'; if(f<86400)return 'in '+Math.ceil(f/3600)+'h'; return 'in '+Math.ceil(f/86400)+'d'; }
    if(s<60)return 'now'; if(s<3600)return Math.floor(s/60)+'m'; if(s<86400)return Math.floor(s/3600)+'h'; if(s<604800)return Math.floor(s/86400)+'d'; return Math.floor(s/604800)+'w';
  }
  function dayIdx(n){ const d=new Date(); const day=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); return ((day%n)+n)%n; }

  /* ---- Weather (Open-Meteo, free, no key) ---- */
  const _dashWx={};
  async function wxGeocode(city){
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
    const j=await r.json(); const g=(j.results||[])[0]; if(!g) return null;
    const extra=[g.admin1,g.country].filter(Boolean).join(', ');
    return {lat:g.latitude, lon:g.longitude, name:g.name+(extra?' · '+extra:'')};
  }
  async function wxLoad(key,lat,lon,unit){
    _dashWx[key]={state:'loading'};
    try{
      const u=(unit==='f')?'fahrenheit':'celsius';
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4&temperature_unit=${u}`);
      const j=await r.json(); _dashWx[key]={state:'ready',d:j,unit};
    }catch(_e){ _dashWx[key]={state:'error'}; }
    (layout||[]).filter(w=>w.type==='weather').forEach(refreshBody);
  }
  function wxKey(cfg){ return cfg.lat+','+cfg.lon+','+(cfg.unit||'c'); }
  function weatherBody(cfg){
    if(cfg.lat==null) return `<div class="dw-mute" style="padding:10px 0">Set a city in ⚙ settings.</div>`;
    const key=wxKey(cfg); const w=_dashWx[key];
    if(!w){ wxLoad(key,cfg.lat,cfg.lon,cfg.unit||'c'); return `<div class="dw-srcbadge">⛅ ${E(cfg.city||'Weather')}</div><div class="dw-mute" style="padding:10px 0">Loading weather…</div>`; }
    if(w.state==='loading') return `<div class="dw-srcbadge">⛅ ${E(cfg.city||'Weather')}</div><div class="dw-mute" style="padding:10px 0">Loading weather…</div>`;
    if(w.state==='error') return `<div class="dw-srcbadge">⛅ Weather</div><div class="dw-mute" style="padding:10px 0">Couldn’t load weather — check the city in ⚙ settings.</div>`;
    const d=w.d||{}, c=d.current||{}, dy=d.daily||{}, deg=(w.unit==='f'?'°F':'°C');
    const wc=WMO[c.weather_code]||['—','🌡️'];
    const days=(dy.time||[]).map((t,i)=>{ const dt=new Date(t+'T00:00:00'); const dn=isNaN(dt)?'':dt.toLocaleDateString('en-ZA',{weekday:'short'}); const em=(WMO[(dy.weather_code||[])[i]]||['','·'])[1];
      return `<div style="text-align:center;flex:1"><div style="font-size:10px;color:var(--muted);font-weight:700">${i===0?'Today':E(dn)}</div><div style="font-size:17px;margin:2px 0">${em}</div><div style="font-size:11px;font-weight:700">${Math.round((dy.temperature_2m_max||[])[i])}°</div><div style="font-size:10px;color:var(--muted)">${Math.round((dy.temperature_2m_min||[])[i])}°</div></div>`; }).join('');
    return `<div class="dw-srcbadge">⛅ ${E(cfg.city||'Weather')}</div>
      <div style="display:flex;align-items:center;gap:12px;margin:2px 0 4px">

    if(!cfg.prompt) return `<div class="dw-connect" style="padding:14px 6px"><p class="dw-mute">Describe anything and AI builds this tile — a daily routine, live stock or crypto prices, or a summary of your own data.</p><button class="btn accent" onclick="dashConfig('${w.id}')">Describe it</button></div>`;
    if(_aiBusy[w.id]) return `<div class="dw-srcbadge">🤖 ${E(cfg.title||'AI')}</div><div class="dw-mute" style="padding:10px 0">Thinking…</div>`;
    if(cfg._err&&!cfg._content) return `<div class="dw-srcbadge">🤖 AI</div><div class="dw-mute" style="padding:10px 0">${E(cfg._err)}</div><div style="margin-top:8px"><button class="btn ghost sm" onclick="dashAiGen('${w.id}')">↻ Try again</button></div>`;
    if(!cfg._content){ setTimeout(()=>dashAiGen(w.id),40); return `<div class="dw-srcbadge">🤖 ${E(cfg.title||'AI')}</div><div class="dw-mute" style="padding:10px 0">Generating…</div>`; }
    if(cfg.auto && (Date.now()-(cfg._at||0) > 20*3600*1000)) setTimeout(()=>dashAiGen(w.id,true),40);
    const when=cfg._at?relTime(new Date(cfg._at)):'';
    const tools=(cfg._tools&&cfg._tools.length)?' · '+cfg._tools.map(t=>AI_TOOL_LBL[t]||t).join(', '):'';
    return `<div>${mdSafe(cfg._content)}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:7px;border-top:1px solid var(--line)">
        <span class="dw-mute" style="font-size:10px">🤖 ${when?'updated '+when:'AI'}${tools}${cfg.auto?' · daily':''}</span>
        <button class="btn ghost sm" style="margin-left:auto;padding:3px 9px" onclick="dashAiGen('${w.id}')">↻ Refresh</button>
      </div>`;
  }
  window.dashAiGen=async function(id,silent){
    const w=(layout||[]).find(x=>x.id===id); if(!w||!w.cfg||!w.cfg.prompt) return;
    if(_aiBusy[id]) return; _aiBusy[id]=true;
    if(!silent) refreshBody(w);
    try{
      const board=(w.cfg.board&&w.cfg.board!=='all')?w.cfg.board:'all';
      const j=await fnPost('bbe-ai','generate',board,{prompt:w.cfg.prompt});
      if(j&&j.ok){ w.cfg._content=j.text||''; w.cfg._at=Date.now(); w.cfg._tools=j.used_tools||[]; delete w.cfg._err; }
      else { w.cfg._err=(j&&j.error)||'Could not generate.'; }
    }catch(_e){ w.cfg._err='Could not reach the AI service.'; }
    _aiBusy[id]=false; save(); refreshBody(w);
  };

  function wireCfg(w){
    document.querySelectorAll('#w_color .dw-sw').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#w_color .dw-sw').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
    if(w.type==='goal'){ document.querySelectorAll('#g_mode button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#g_mode button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); const v=b.dataset.v; document.getElementById('g_manual').style.display=v==='manual'?'block':'none'; document.getElementById('g_auto').style.display=v==='auto'?'block':'none'; }); }
    if(w.type==='calendar'){ document.querySelectorAll('#c_src button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#c_src button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); document.getElementById('c_hint').textContent=b.dataset.v==='external'?'Connect a Google/Outlook calendar to show real meetings.':'Shows your scheduled posts and deadlines. No setup needed.'; }); }
    const segWire=id=>{ document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }); };
    if(w.type==='weather') segWire('wx_unit');
    if(w.type==='focus') segWire('fc_q');
    if(w.type==='ai') segWire('ai_auto');
    if(w.type==='clock'){ const sel=document.getElementById('clk_add'), ta=document.getElementById('clk_zones'); if(sel&&ta) sel.onchange=()=>{ if(sel.value){ ta.value=(ta.value.trim()?ta.value.replace(/\s*$/,'')+'\n':'')+sel.value; sel.value=''; } }; }
  }
  window.dashCfgSave=async function(){
    const w=(layout||[]).find(x=>x.id===editingId); if(!w)return;
    // appearance — applies to every widget
    const t=document.getElementById('w_title'); const title=t?t.value.trim():'';
    if(title) w.cfg.title=title; else delete w.cfg.title;
    const swOn=document.querySelector('#w_color .dw-sw.on'); const col=swOn?swOn.dataset.color:'';
    if(col) w.cfg.color=col; else delete w.cfg.color;
    if(w.type==='goal'){
      w.cfg.label=document.getElementById('g_label').value;
      w.cfg.mode=document.querySelector('#g_mode button.on').dataset.v;
      if(w.cfg.mode==='manual'){ w.cfg.current=Number(document.getElementById('g_current').value)||0; w.cfg.target=Number(document.getElementById('g_target').value)||0; w.cfg.unit=document.getElementById('g_unit').value; }
      else { w.cfg.source=document.getElementById('g_source').value; w.cfg.board=document.getElementById('g_board').value; w.cfg.target=Number(document.getElementById('g_target2').value)||0; }
      w.cfg.deadline=document.getElementById('g_deadline').value||'';
    }
    if(w.type==='analytics'){ w.cfg.platform=document.getElementById('a_platform').value; w.cfg.board=document.getElementById('a_board').value; }
    if(w.type==='calendar') w.cfg.source=document.querySelector('#c_src button.on').dataset.v;
    if(w.type==='inbox'){ w.cfg.board=document.getElementById('i_board').value; w.cfg.channel=document.getElementById('i_channel').value; }
    if(['website','search','email','sales','reviews','ads'].includes(w.type)){ const wb=document.getElementById('wb_board'); if(wb) w.cfg.board=wb.value; }
    if(w.type==='weather'){
      const seg=document.querySelector('#wx_unit button.on'); w.cfg.unit=seg?seg.dataset.v:'c';
      const city=(document.getElementById('wx_city').value||'').trim();
      if(city && city!==w.cfg.city){
        const saveBtn=document.querySelector('#dashCfgModal .btn.accent'); const old=saveBtn?saveBtn.textContent:''; if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='Finding city…';}
        try{ const g=await wxGeocode(city); if(g){ w.cfg.city=g.name; w.cfg.lat=g.lat; w.cfg.lon=g.lon; } else { w.cfg.city=city; } }
        catch(_e){ w.cfg.city=city; }
        if(saveBtn){saveBtn.disabled=false;saveBtn.textContent=old;}
      } else if(city){ w.cfg.city=city; }
      Object.keys(_dashWx).forEach(k=>delete _dashWx[k]);
    }
    if(w.type==='clock'){ const ta=document.getElementById('clk_zones');
      w.cfg.zones=(ta?ta.value:'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const p=l.split('|'); return [ (p[0]||'').trim()||'—', (p[1]||p[0]||'').trim() ]; });
    }
    if(w.type==='focus'){ const seg=document.querySelector('#fc_q button.on'); w.cfg.showQuote=seg?seg.dataset.v==='1':true; }
    if(w.type==='countdown'){ w.cfg.label=(document.getElementById('cd_label').value||'').trim(); w.cfg.date=document.getElementById('cd_date').value||''; }
    if(w.type==='activity'){ w.cfg.board=document.getElementById('ac_board').value; }
    if(w.type==='besttime'){ w.cfg.board=document.getElementById('bt_board').value; }
    if(w.type==='toppost'){ w.cfg.board=document.getElementById('tp_board').value; }
    if(w.type==='mentions'){ w.cfg.board=document.getElementById('mn_board').value; w.cfg.keyword=(document.getElementById('mn_kw').value||'').trim(); }
    if(w.type==='trends'){ w.cfg.board=document.getElementById('tr_board').value; w.cfg.watch=(document.getElementById('tr_watch').value||'').split(/[\s,]+/).map(s=>s.trim()).filter(Boolean).map(s=>s[0]==='#'?s:'#'+s); Object.keys(_dashTags).forEach(k=>delete _dashTags[k]); }
    if(w.type==='news'){ w.cfg.url=(document.getElementById('nw_url').value||'').trim(); w.cfg.title=(document.getElementById('nw_title').value||'').trim(); }
    if(w.type==='sitehealth'){ w.cfg.url=(document.getElementById('sh_url').value||'').trim(); }
    if(w.type==='ai'){
      const np=(document.getElementById('ai_prompt').value||'').trim();
      const seg=document.querySelector('#ai_auto button.on'); const nauto=seg?seg.dataset.v==='1':false;
      const nb=document.getElementById('ai_board').value;
      if(np!==w.cfg.prompt || nb!==w.cfg.board){ w.cfg._content=''; w.cfg._at=0; delete w.cfg._err; delete w.cfg._tools; }
      w.cfg.prompt=np; w.cfg.board=nb; w.cfg.auto=nauto;
    }
    // apply tile colour to the root immediately
    const root=document.querySelector('.dw[data-id="'+w.id+'"]'); if(root){ if(w.cfg.color) root.style.setProperty('--wc',w.cfg.color); else root.style.removeProperty('--wc'); }
    refreshBody(w); hideModal('dashCfgModal'); save(); dtoast('Widget updated');
  };

  /* ============ GRIDSTACK LIB LOADER ============ */
  function ensureLib(cb){
    if(window.GridStack) return cb();
    if(!document.getElementById('gs-css')){ const l=document.createElement('link'); l.id='gs-css'; l.rel='stylesheet'; l.href='https://cdnjs.cloudflare.com/ajax/libs/gridstack.js/10.3.1/gridstack.min.css'; document.head.appendChild(l); }
    let s=document.getElementById('gs-js');
    if(s){ s.addEventListener('load',cb); return; }
    s=document.createElement('script'); s.id='gs-js'; s.src='https://cdnjs.cloudflare.com/ajax/libs/gridstack.js/10.3.1/gridstack-all.min.js';
    s.onload=cb; s.onerror=()=>{ const g=document.getElementById('dashGrid'); if(g) g.innerHTML='<div class="dw-mute" style="padding:24px">Couldn’t load the dashboard engine. Check your connection and refresh.</div>'; };
    document.head.appendChild(s);
  }

  /* ============ INIT (called each time home view renders) ============ */
  window.dashInit=function(){
    const host=document.getElementById('dashGrid'); if(!host) return;
    ensureLib(async()=>{
      if(layout===null){ await loadLayout(); }
      // (re)build grid fresh
      host.innerHTML='';
      if(grid){ try{ grid.destroy(false); }catch(_e){} grid=null; }
      grid=GridStack.init({column:12, cellHeight:78, margin:6, float:true, handle:'.dw-head', disableDrag:!editing, disableResize:!editing, animate:true}, host);
      grid.on('change',()=>save());
      (layout||[]).forEach(mountWidget);
      refreshEmpty();
      // sync body edit state
      document.body.classList.toggle('dash-editing',editing);
      const b=document.getElementById('dashEditBtn'); if(b){ b.innerHTML=editing?'✓ Done':'✎ Edit layout'; b.classList.toggle('accent',editing); }
      // load data once (then refresh bodies)
      if(!dataReady) loadData(); else refreshAllBodies();
      // keep world-clock tiles ticking (once)
      if(!window._dashClockT){ window._dashClockT=setInterval(()=>{ try{ (layout||[]).filter(w=>w.type==='clock').forEach(refreshBody); }catch(_e){} }, 15000); }
    });
  };

  /* ============ delegated clicks for widget tools ============ */
  document.addEventListener('click',function(e){
    const b=e.target.closest('[data-dact]'); if(!b) return;
    const act=b.dataset.dact, id=b.dataset.id;

  });

    setTimeout(window.dashInit,40);
    return `<div class="dash-wrap">
      <div class="dash-top">
        <div><h2 class="dash-h">${typeof ic!=='undefined'?ic('sun',18):''} ${greet}, ${first}</h2>
          <div class="dash-sub">${WS?E(WS.name):''} · your personal home</div></div>
        <div class="dash-tools">
          <span class="dash-modehint">✎ Drag, resize, remove — then Done</span>
          <button class="btn" onclick="dashTidy()" title="Auto-arrange widgets into a tidy, gap-free layout">▦ Tidy up</button>
          <button class="btn" onclick="dashOpenCatalog()">＋ Add widget</button>
          <button class="btn" id="dashEditBtn" onclick="dashToggleEdit()">✎ Edit layout</button>
        </div>
      </div>
      <div class="grid-stack" id="dashGrid"></div>
      <div class="dash-empty" id="dashEmpty" style="display:none">
        <b>Your home is empty</b><div class="dw-mute">Add widgets to build a home that works the way you do.</div>
        <button class="btn accent" style="margin-top:12px" onclick="dashOpenCatalog()">＋ Add your first widget</button>
      </div>

      <div class="dw-scrim" id="dashCatModal">
        <div class="dw-modal">
          <div class="dw-mh"><h3>Add a widget</h3><button class="dw-x" onclick="dashHideModal('dashCatModal')">✕</button></div>
          <div class="dw-mb"><div class="dw-cat" id="dashCatList"></div></div>
        </div>
      </div>
      <div class="dw-scrim" id="dashCfgModal">
        <div class="dw-modal sm">
          <div class="dw-mh"><h3 id="dashCfgTitle">Configure</h3><button class="dw-x" onclick="dashHideModal('dashCfgModal')">✕</button></div>
          <div class="dw-mb" id="dashCfgBody"></div>
          <div class="dw-mf"><button class="btn" onclick="dashHideModal('dashCfgModal')">Cancel</button><button class="btn accent" onclick="dashCfgSave()">Save widget</button></div>
        </div>
      </div>
    </div>`;
  };

  // close modals on scrim click
  document.addEventListener('click',function(e){ if(e.target.classList&&e.target.classList.contains('dw-scrim')) e.target.classList.remove('on'); });
})();

</script>
<script id="wp-js">
/* ============ WordPress (self-hosted) publishing ============ */
(function(){
  if(window.__wpLoaded)return; window.__wpLoaded=true;
  async function wpApi(body){
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(`${SUPABASE_URL}/functions/v1/bbe-wordpress`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+(session?session.access_token:'')},body:JSON.stringify({workspace_id:WS.id,...body})});
    return await r.json();
  }
  window.wpBlogModal=async function(){
    if(!S.board){toast('Open a board first');return;}
    toast('Checking WordPress…');
    let st; try{ st=await wpApi({action:'status',board_id:S.board}); }catch(e){ fail(e); return; }
    if(st&&st.connected) wpComposeModal(st); else wpConnectModal();
  };
  function wpConnectModal(){
    openModal(`<h3>Connect WordPress</h3>
      <p style="font-size:12.5px;color:var(--muted);margin:2px 0 12px;line-height:1.5">Self-hosted WordPress. In your WP admin open <b>Users → Profile → Application Passwords</b>, create one named “Boards”, and paste it below. Your normal login password is never used or stored.</p>
      <label>Site URL</label><input id="wp-url" placeholder="https://yourblog.com">
      <label>WordPress username</label><input id="wp-user" placeholder="your WP username">
      <label>Application password</label><input id="wp-pass" type="password" placeholder="xxxx xxxx xxxx xxxx xxxx xxxx">
      <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn accent" id="wp-conn-go" onclick="wpConnectSubmit()">Connect</button></div>`);
    setTimeout(()=>{const e=$('wp-url');if(e)e.focus();},60);
  }
  window.wpConnectSubmit=async function(){
    const g=id=>{const e=$(id);return e?e.value.trim():'';};
    const url=g('wp-url'),user=g('wp-user'),pass=g('wp-pass');
    if(!url||!user||!pass){toast('Fill in all three fields');return;}
    const b=$('wp-conn-go'); if(b){b.disabled=true;b.textContent='Connecting…';}
    try{ const j=await wpApi({action:'connect',board_id:S.board,site_url:url,username:user,app_password:pass});
      if(j&&j.error){toast(j.error);if(b){b.disabled=false;b.textContent='Connect';}return;}
      toast('WordPress connected'+(j.site_name?': '+j.site_name:'')); wpComposeModal(j);
    }catch(e){fail(e);if(b){b.disabled=false;b.textContent='Connect';}}
  };
  function wpComposeModal(st){
    const name=(st&&(st.site_name||st.site_url))||'your blog';
    openModal(`<h3>New blog post <span style="font-weight:500;font-size:12.5px;color:var(--muted)">· ${esc(name)}</span></h3>
      <label>Title</label><input id="wp-title" placeholder="Post title">
      <label>Content</label><textarea id="wp-body" rows="8" placeholder="Write your post…  (HTML is allowed)"></textarea>
      <label>Publish</label>
      <select id="wp-status" onchange="var w=document.getElementById('wp-when');if(w)w.style.display=this.value==='future'?'block':'none'">
        <option value="draft">Save as draft</option>
        <option value="publish">Publish now</option>
        <option value="future">Schedule…</option>
      </select>
      <div id="wp-when" style="display:none;margin-top:8px"><label>Date &amp; time</label><input id="wp-date" type="datetime-local"></div>
      <div class="row" style="margin-top:14px"><button class="btn ghost sm" onclick="wpDisconnect()" style="color:var(--danger)">Disconnect site</button>
      <span style="flex:1"></span><button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn accent" id="wp-pub-go" onclick="wpPublishNow()">Post to WordPress</button></div>`);
    setTimeout(()=>{const e=$('wp-title');if(e)e.focus();},60);
  }
  window.wpPublishNow=async function(){
    const g=id=>{const e=$(id);return e?e.value.trim():'';};
    const title=g('wp-title'),content=g('wp-body'),status=(($('wp-status')||{}).value)||'draft';
    if(!title&&!content){toast('Write something first');return;}
    let date=null;
    if(status==='future'){ const dv=($('wp-date')||{}).value; if(!dv){toast('Pick a date & time');return;} try{date=new Date(dv).toISOString();}catch(_e){} }
    const b=$('wp-pub-go'); if(b){b.disabled=true;b.textContent='Posting…';}
    try{ const j=await wpApi({action:'publish',board_id:S.board,title,content,status,date});
      if(j&&j.error){toast(j.error);if(b){b.disabled=false;b.textContent='Post to WordPress';}return;}
      closeModal();
      const msg=status==='publish'?'Published to WordPress':status==='future'?'Scheduled on WordPress':'Saved as draft in WordPress';
      if(j&&j.link) toast(msg,'Open ↗',()=>window.open(j.link,'_blank')); else toast(msg);
    }catch(e){fail(e);if(b){b.disabled=false;b.textContent='Post to WordPress';}}
  };
  window.wpDisconnect=async function(){
    if(!confirm('Disconnect this WordPress site from the board? You can reconnect any time.'))return;
    try{ await wpApi({action:'disconnect',board_id:S.board}); }catch(_e){}
    closeModal(); toast('WordPress disconnected');
  };
})();
</script>
</body>
</html>
