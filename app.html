<style>
:root{
  --accent:#C75B12; --accent-soft:#FBF1E8;
  --bg:#F7F6F3; --card:#FFFFFF; --ink:#23241f; --muted:#8a887e;
  --line:#E7E5DE; --line-strong:#D6D3C9;
  --ok:#1D9E75; --danger:#C6453D; --warn:#BA7517;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit;font-size:13.5px}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;width:100%;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.accent{background:var(--accent)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:var(--bg);opacity:1}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line-strong);border-radius:16px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:3px 10px;font-size:11.5px;font-weight:700;color:#fff;background:var(--accent)}
.socic{position:relative;display:inline-flex;line-height:0}
.socic .x{position:absolute;top:-5px;right:-5px;width:14px;height:14px;line-height:13px;text-align:center;border-radius:50%;background:#c0392b;color:#fff;font-size:9px;font-weight:800;cursor:pointer;display:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.socic:hover .x{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.avatar{width:30px;height:30px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.wordmark{font-weight:800;font-size:16px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px;cursor:pointer}
.wordmark em{font-style:normal;color:var(--accent)}
.wordmark small{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.tabs{display:none;gap:2px;margin-left:14px}
.tabs button{padding:8px 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tabs button.active{background:var(--accent-soft);color:var(--accent)}
.tabs button:hover{color:var(--ink)}
main{padding:16px;max-width:1280px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:10px;position:relative}
.bottomnav button.active{color:var(--accent)}
.bottomnav .bdot{position:absolute;top:0;right:4px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 5px}
.bottomnav{overflow-x:auto}
.bottomnav button{flex:none;min-width:54px}
.appshell{display:flex;min-height:100vh}
.sidebar{display:none}
.contentarea{flex:1;min-width:0;max-width:100%}
.sb-brand{font-weight:800;font-size:15px;letter-spacing:-.01em;padding:4px 10px 12px;cursor:pointer}
.sb-brand small{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.sb-back{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--accent);padding:2px 10px 6px;width:100%;text-align:left}
.sb-bhead{display:flex;align-items:center;gap:6px;padding:0 6px 10px}
.sb-sw{width:11px;height:11px;border-radius:4px;flex:none}
.sb-switch{border:none;background:transparent;font-weight:800;font-size:14.5px;padding:2px 2px;width:auto;max-width:148px;cursor:pointer;color:var(--ink)}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);text-align:left}
.sb-item:hover{background:#F1EFEA;color:var(--ink)}
.sb-item.on{background:var(--accent-soft);color:var(--accent)}
.sb-item .sb-b{margin-left:auto;background:var(--accent);color:#fff;border-radius:9px;padding:0 6px;font-size:10px;font-weight:800}
.sb-sec{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 5px}
.sb-dot{width:10px;height:10px;border-radius:3px;flex:none}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line);margin-top:16px}

/* toast with optional undo action */
let _toastT=null,_toastFn=null;
function toast(msg,actionLabel,actionFn){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  clearTimeout(_toastT); _toastFn=actionFn||null;
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML=`<span>${msg}</span>${actionLabel?`<button onclick="_toastFn&&_toastFn();this.parentElement.remove()">${actionLabel}</button>`:''}`;
  document.body.appendChild(el);
  _toastT=setTimeout(()=>el.remove(),actionLabel?6000:3200);
}
/* plan */
function planEff(){
  if(!WS)return 'free';
  if(WS.plan==='agency')return 'agency';
  if(WS.plan==='pro')return 'pro';
  if(WS.plan==='basic')return 'basic';
  if(WS.plan==='trial'&&WS.trial_ends>=saDate())return 'pro';
  return 'free';
}
const paidAI=()=>['pro','agency'].includes(planEff());
function trialDaysLeft(){
  if(!WS||WS.plan!=='trial')return 0;
  return Math.max(0,Math.round((new Date(WS.trial_ends)-new Date(saDate()))/86400000));
}
function applyTheme(){
  const t=(WS&&WS.theme)||{};
  const p=PRESETS[t.preset]||PRESETS.classic;
  const accent=t.accent||p.accent;
  document.documentElement.style.setProperty('--accent',accent);
  document.documentElement.style.setProperty('--accent-soft',tint(accent,12));
}

async function loadWs(){
  const {data:mems,error}=await sb.from('bbe_members').select('*').eq('user_id',SESSION.user.id);
  if(error)throw error;
  MYWS=mems||[];
  if(!MYWS.length){WS=null;MEM=null;return;}
  const savedWs=localStorage.getItem('bbe_ws');
  MEM=MYWS.find(m=>m.workspace_id===savedWs)||MYWS[0];
  const [w,mm,b]=await Promise.all([
    sb.from('bbe_workspaces').select('*').eq('id',MEM.workspace_id).single(),
    sb.from('bbe_members').select('*').eq('workspace_id',MEM.workspace_id).order('created_at'),
    sb.from('bbe_boards').select('*').eq('workspace_id',MEM.workspace_id).order('created_at'),
  ]);
  if(w.error)throw w.error;
  WS=w.data; MEMBERS=mm.data||[]; BOARDS=b.data||[];
  localStorage.setItem('bbe_ws',WS.id);
  if(!BOARDS.find(x=>x.id===S.board))S.board=localStorage.getItem('bbe_board_'+WS.id);
  if(!BOARDS.find(x=>x.id===S.board))S.board=BOARDS[0]?BOARDS[0].id:null;
  applyTheme();
}
async function loadBoard(){
  if(!S.board){cur={cols:[],notes:[],msgs:[],invs:[],pins:[],posts:[],budget:[],planNodes:[],planEdges:[],planFrames:[]};return;}
  const [c,n,m,iv,p,po,bd,pn,pe,pf]=await Promise.all([
    sb.from('bbe_columns').select('*').eq('board_id',S.board).order('position'),
    sb.from('bbe_notes').select('*').eq('board_id',S.board),
    sb.from('bbe_messages').select('*').eq('board_id',S.board).order('created_at',{ascending:false}).limit(40),
    sb.from('bbe_invoices').select('*').eq('board_id',S.board).order('created_at'),
    sb.from('bbe_pins').select('*').eq('board_id',S.board).order('created_at'),
    sb.from('bbe_posts').select('*').eq('board_id',S.board).order('post_date'),
    sb.from('bbe_budget').select('*').eq('board_id',S.board).order('position'),
    sb.from('bbe_plan_nodes').select('*').eq('board_id',S.board).order('position'),
    sb.from('bbe_plan_edges').select('*').eq('board_id',S.board),
    sb.from('bbe_plan_frames').select('*').eq('board_id',S.board).order('position'),
  ]);
  if(c.error)throw c.error;
  cur={cols:c.data||[],notes:n.data||[],msgs:(m.data||[]).reverse(),invs:iv.data||[],pins:p.data||[],posts:po.data||[],budget:bd.data||[],planNodes:pn.data||[],planEdges:pe.data||[],planFrames:pf.data||[]};
}

/* today */
const tdDone=t=>t.note_id?!!(TDN[t.note_id]&&TDN[t.note_id].done):!!t.done;
async function loadToday(){
  if(!WS)return;
  const {data}=await sb.from('bbe_today').select('*').eq('user_id',SESSION.user.id).eq('workspace_id',WS.id).eq('for_date',saDate()).order('position');
  TD=data||[]; TDN={};TDC={};
  const ids=TD.map(t=>t.note_id).filter(Boolean);
  if(ids.length){
    const [{data:ns},{data:cs}]=await Promise.all([
      sb.from('bbe_notes').select('id,title,done,archived,due_date,warn_days,column_id,board_id').in('id',ids),
      sb.from('bbe_columns').select('id,name,color,board_id').eq('workspace_id',WS.id),
    ]);
    (ns||[]).forEach(n=>TDN[n.id]=n);(cs||[]).forEach(c=>TDC[c.id]=c);
  }
}
async function ensureToday(){
  if(!WS)return;
  const today=saDate();
  const {data:ex}=await sb.from('bbe_today').select('id').eq('user_id',SESSION.user.id).eq('workspace_id',WS.id).eq('for_date',today).limit(1);
  if(ex&&ex.length){await loadToday();return;}
  const rows=[];let pos=0;
  const {data:prev}=await sb.from('bbe_today').select('*').eq('user_id',SESSION.user.id).eq('workspace_id',WS.id).lt('for_date',today).order('for_date',{ascending:false}).limit(40);
  const prevDate=prev&&prev.length?prev[0].for_date:null; const carried=new Set();
  if(prevDate){
    const pids=prev.filter(p=>p.for_date===prevDate&&!p.removed&&p.note_id).map(p=>p.note_id);
    let open={};
    if(pids.length){const {data:pn}=await sb.from('bbe_notes').select('id,done,archived').in('id',pids);(pn||[]).forEach(n=>open[n.id]=n);}
    for(const p of prev.filter(p=>p.for_date===prevDate&&!p.removed)){
      if(p.note_id){const n=open[p.note_id];if(n&&!n.done&&!n.archived){rows.push({workspace_id:WS.id,user_id:SESSION.user.id,for_date:today,note_id:p.note_id,reason:'carried over',position:pos++});carried.add(p.note_id);}}
      else if(!p.done&&p.text_line)rows.push({workspace_id:WS.id,user_id:SESSION.user.id,for_date:today,text_line:p.text_line,reason:'carried over',position:pos++});
    }
  }
  const {data:cand}=await sb.from('bbe_notes').select('id,done,archived,due_date,warn_days,assignee').eq('workspace_id',WS.id).eq('done',false).eq('archived',false).not('due_date','is',null);
  const t0=new Date(today+'T00:00:00Z').getTime();
  for(const n of (cand||[])){
    if(carried.has(n.id))continue;
    if(n.assignee&&n.assignee!==SESSION.user.id)continue;
    const days=Math.round((new Date(n.due_date+'T00:00:00Z').getTime()-t0)/86400000);
    if(days>(n.warn_days??7))continue;
    rows.push({workspace_id:WS.id,user_id:SESSION.user.id,for_date:today,note_id:n.id,reason:days<0?'overdue':'due soon',position:pos++});
  }
  if(rows.length){const {error}=await sb.from('bbe_today').insert(rows);if(error)console.error(error);}
  else await sb.from('bbe_today').insert({workspace_id:WS.id,user_id:SESSION.user.id,for_date:today,text_line:null,reason:'__init__',removed:true,position:0});
  await loadToday();
}

function pwToggle(inp){
  if(!inp || inp.dataset.pweye) return; inp.dataset.pweye='1';
  inp.style.paddingRight='60px';
  const wrap=document.createElement('span'); wrap.style.cssText='position:relative;display:block';
  inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
  const btn=document.createElement('button'); btn.type='button'; btn.textContent='Show';
  btn.style.cssText='position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;padding:2px 4px';
  btn.onclick=function(){ const show=inp.type==='password'; inp.type=show?'text':'password'; btn.textContent=show?'Hide':'Show'; inp.focus(); };
  wrap.appendChild(btn);
}
function enhancePasswords(){ try{ document.querySelectorAll('input[type="password"]').forEach(pwToggle); }catch(_e){} }
function go(v){
  const bv=['btoday','board','plan','content','analytics','binbox','files','money','team','setup'];
  S.scope=bv.includes(v)?'board':'workspace';
  S.view=v;
  if(v==='content')_contentAll=false;
  if(v==='today')loadToday().then(render).catch(fail);
  render();
}
function leaveBoard(){S.scope='workspace';go('boards');}
async function switchBoardTo(id){S.board=id;localStorage.setItem('bbe_board_'+WS.id,id);S.col=null;await loadBoard();go('btoday');}
function navItems(){
  if(S.scope==='board'&&S.board){
    const b=BOARDS.find(x=>x.id===S.board);
    if(b){
      const m=b.modules||{content:true,inbox:true,money:true,team:true};
      const items=[['btoday','sun','Today']];
      if(m.plan!==false)items.push(['plan','route','Plan']);
      items.push(['board','board','Board']);
      if(m.content)items.push(['content','calendar','Content']);
      if(m.content)items.push(['analytics','chart','Analytics']);
      if(m.inbox)items.push(['binbox','mail','Inbox']);
      if(m.files)items.push(['files','note','Files']);
      if(m.money)items.push(['money','money','Money']);
      if(m.team)items.push(['team','users','Team']);
      items.push(['setup','gear','Setup']);
      return {ws:false,items,board:b};
    }
  }
  const wsItems=[['boards','home','Dashboard'],['today','sun','Today'],['inbox','mail','Inbox']];
  if((_waAccounts||[]).some(a=>a&&a.status!=='disabled'))wsItems.push(['wa','chat','WhatsApp Usage']);
  return {ws:true,items:wsItems};
}

function authErr(m){const e=$('a-err');if(e){e.textContent=m;e.style.display='block';}}
async function doSignIn(){
  const email=$('a-email').value.trim(),pw=$('a-pw').value;
  if(!email||!pw){authErr('Enter your email and password.');return;}
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){authErr(error.message==='Invalid login credentials'?'Wrong email or password.':error.message);return;}
  const {data:{session}}=await sb.auth.getSession(); SESSION=session;
  await boot();
}
async function doSignUp(){
  const name=$('a-name').value.trim(),ws=$('a-ws').value.trim(),email=$('a-email').value.trim(),pw=$('a-pw').value;
  if(!name||!ws||!email||pw.length<8){authErr('Fill in everything — password at least 8 characters.');return;}
  const b=$('a-go');b.disabled=true;b.textContent='Creating…';
  try{
    const res=await fetch(`${SUPABASE_URL}/functions/v1/bbe-signup`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({email,password:pw,name,workspace:ws})});
    const j=await res.json();
    if(!res.ok||j.error)throw new Error(j.error||'Could not create the workspace');
    const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error&&!/confirm/i.test(error.message))throw error;
    const {data:{session}}=await sb.auth.getSession(); SESSION=session;
    if(SESSION)await boot(); else {_authMode='in';render();}
    toast('📬 Almost there — confirm your email via the link we just sent');
  }catch(e){authErr(e.message||String(e));b.disabled=false;b.textContent='Create workspace';}
}
async function doForgot(){

async function createOwnWs(){
  const name=prompt('Workspace name:'); if(!name)return;
  try{
    const slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,30)+'-'+Math.random().toString(36).slice(2,5);
    const {data:ws,error}=await sb.from('bbe_workspaces').insert({name:name.trim(),slug,created_by:SESSION.user.id}).select().single();
    if(error)throw error;
    const meta=SESSION.user.email||'';
    const {error:e2}=await sb.from('bbe_members').insert({workspace_id:ws.id,user_id:SESSION.user.id,role:'owner',name:meta.split('@')[0],initials:meta.slice(0,2).toUpperCase(),email:meta});
    if(e2)throw e2;
    await refresh();
  }catch(e){fail(e);}
}

function tdReason(t){
  if(!t.note_id)return t.reason==='carried over'?'carried over':'';
  const n=TDN[t.note_id]; if(!n)return t.reason;
  if(n.due_date){
    const days=Math.round((new Date(n.due_date+'T00:00:00Z')-new Date(saDate()+'T00:00:00Z'))/86400000);
    if(days<0)return `overdue ${-days}d`; if(days===0)return 'due today';
    if(days<=(n.warn_days??7))return `due in ${days}d`;
  }
  return t.reason==='carried over'?'carried over':'';
}
function todayView(){
  const items=TD.filter(t=>!t.removed&&t.reason!=='__init__'&&(t.note_id?TDN[t.note_id]&&!TDN[t.note_id].archived:t.text_line));
  const open=items.filter(t=>!tdDone(t)),done=items.filter(t=>tdDone(t));
  const row=t=>{
    const n=t.note_id?TDN[t.note_id]:null;
    const c=n?TDC[n.column_id]:null;
    const b=n?BOARDS.find(x=>x.id===n.board_id):null;
    const r=tdReason(t),ov=/^overdue/.test(r),d=tdDone(t);
    return `<div class="task-row ${d?'done':''}" style="--c:${c?c.color:'#B4B2A9'};${ov&&!d?'background:#FDF1EF;':''}">
      <button class="chk ${d?'on':''}" onclick="tdToggle('${t.id}')">${d?'✓':''}</button>
      <div class="t"><b style="${d?'text-decoration:line-through':''}">${esc(n?n.title:t.text_line)}</b>
        <span>${n?`${b?esc(b.name):''}${b&&b.private_to?' '+ic('lock',10):''} › ${c?esc(c.name):''}`:'quick job'}</span></div>
      ${r?`<span style="flex:none;font-size:10.5px;font-weight:800;border-radius:8px;padding:2px 8px;${ov?'background:#F7C1C1;color:#791F1F':r==='carried over'?'background:#EEECE4;color:#6b695f':'background:#FAEEDA;color:#854F0B'}">${esc(r)}</span>`:''}
      ${n?`<button class="btn ghost sm" onclick="tdOpen('${t.id}')">open</button>`:''}
      <button style="color:var(--muted);padding:3px" title="Not today" onclick="tdRemove('${t.id}')">${ic('x',13)}</button>
    </div>`;};
  return `<div class="view-title"><h2>${ic('sun',18)} Today</h2>
    <span class="sub">${new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long'})}</span>
    <span style="flex:1"></span><span class="pill" style="background:var(--ok)">${done.length}/${items.length} done</span></div>
  ${open.map(row).join('')||'<div class="empty">Nothing on your list — pull tasks in with the ☀ on any card, or add a quick job below.</div>'}
  ${done.length?`<div style="font-size:11px;font-weight:800;color:var(--muted);margin:14px 0 8px;letter-spacing:.05em">DONE TODAY</div>${done.map(row).join('')}`:''}
  <div style="display:flex;gap:8px;margin-top:14px">
    <input id="td-new" placeholder="Add a quick job for today…" onkeydown="if(event.key==='Enter'){event.preventDefault();tdAdd();}">
    <button class="btn accent" onclick="tdAdd()">${ic('plus',14)} Add</button>
  </div>`;
}
async function tdToggle(id){
  const t=TD.find(x=>x.id===id); if(!t)return;
  try{
    if(t.note_id){const n=TDN[t.note_id];const {error}=await sb.from('bbe_notes').update({done:!n.done}).eq('id',t.note_id);if(error)throw error;n.done=!n.done;}
    else{const {error}=await sb.from('bbe_today').update({done:!t.done}).eq('id',id);if(error)throw error;t.done=!t.done;}
    render();
  }catch(e){fail(e);}
}
async function tdRemove(id){try{await sb.from('bbe_today').update({removed:true}).eq('id',id);const t=TD.find(x=>x.id===id);if(t)t.removed=true;render();}catch(e){fail(e);}}

async function boardDeleteConfirmed(id){
  if(!canManage()){toast('Only the owner or an admin can delete a board');return;}
  const btn=$('bd-go'); if(btn){btn.disabled=true;btn.textContent='Deleting…';}
  try{
    const {error}=await sb.rpc('bbe_delete_board',{p_board:id}); if(error)throw error;
    const wasCurrent=(S.board===id);
    if(wasCurrent){S.board=null; if(WS)localStorage.removeItem('bbe_board_'+WS.id);}
    closeModal();
    await loadWs();
    if(wasCurrent){ try{await loadBoard();}catch(_e){} go('boards'); } else { render(); }
    toast('Board deleted');
  }catch(e){fail(e); if(btn){btn.disabled=false;btn.innerHTML=ic('trash',13)+' Delete board';}}
}

function planDragStart(ev,id){
  if(ev.target.closest('button'))return;
  if(_planConnect){planPickConnect(id);return;}
  const node=cur.planNodes.find(x=>x.id===id); if(!node)return;
  ev.preventDefault();
  const el=ev.currentTarget;
  _pd={id,el,sx:ev.clientX,sy:ev.clientY,ox:Number(node.x)||0,oy:Number(node.y)||0,moved:false};
  if(el.setPointerCapture)try{el.setPointerCapture(ev.pointerId);}catch(_){}
  el.onpointermove=e=>{
    if(!_pd)return;
    const dx=e.clientX-_pd.sx,dy=e.clientY-_pd.sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4)_pd.moved=true;
    if(!_pd.moved||!canManage())return;
    el.style.left=Math.max(0,_pd.ox+dx)+'px';
    el.style.top=Math.max(0,_pd.oy+dy)+'px';
  };
  el.onpointerup=async e=>{
    el.onpointermove=null; el.onpointerup=null;
    const d=_pd; _pd=null; if(!d)return;
    if(!d.moved){planNodeModal(id);return;}
    if(!canManage())return;
    const nx=Math.max(0,Math.round(d.ox+(e.clientX-d.sx))),ny=Math.max(0,Math.round(d.oy+(e.clientY-d.sy)));
    const n2=cur.planNodes.find(x=>x.id===id); if(n2){n2.x=nx;n2.y=ny;}
    render();
    try{const {error}=await sb.from('bbe_plan_nodes').update({x:nx,y:ny}).eq('id',id);if(error)throw error;}catch(err){fail(err);}
  };
}

}

async function savePlanNode(id,mk){
  if(!canManage())return;
  const n=cur.planNodes.find(x=>x.id===id); if(!n)return;
  const patch={title:($('pn-title').value||'').trim()||n.title,note:($('pn-note').value||'').trim()||null,color:_planColor||n.color,start_date:$('pn-start').value||null,due_date:$('pn-due').value||null,kind:($('pn-kind')&&$('pn-kind').value)||n.kind||'step',cost:Number($('pn-cost').value)||null,budget_cat:($('pn-bcat').value||'').trim()||null,channels:_planChannels||n.channels||[]};
  try{
    const {error}=await sb.from('bbe_plan_nodes').update(patch).eq('id',id); if(error)throw error;
    Object.assign(n,patch);
    closeModal();
    if(mk)await planMakeTask(id);
    else{await loadBoard();render();}
  }catch(e){fail(e);}
}
async function planDelNode(id){
  if(!canManage())return;
  const n=cur.planNodes.find(x=>x.id===id);
  if(!confirm(`Delete “${n?n.title:'this step'}”? Tasks already on the board stay.`))return;
  try{
    await sb.from('bbe_plan_edges').delete().or(`from_node.eq.${id},to_node.eq.${id}`);
    const {error}=await sb.from('bbe_plan_nodes').delete().eq('id',id); if(error)throw error;
    closeModal(); await loadBoard(); render(); toast('Step deleted');
  }catch(e){fail(e);}
}

async function planPickConnect(id){
  if(!canManage())return;
  if(!_planConnectFrom){_planConnectFrom=id;render();return;}
  if(_planConnectFrom===id){_planConnectFrom=null;render();return;}
  const a=_planConnectFrom,b=id;
  if(cur.planEdges.some(e=>(e.from_node===a&&e.to_node===b)||(e.from_node===b&&e.to_node===a))){_planConnectFrom=null;render();toast('Already linked');return;}
  try{
    const {error}=await sb.from('bbe_plan_edges').insert({workspace_id:WS.id,board_id:S.board,from_node:a,to_node:b});
    if(error)throw error;
    _planConnectFrom=null;
    await loadBoard();render();
  }catch(e){fail(e);}
}

async function planFirstCol(){

    const {data:col,error}=await sb.from('bbe_columns').insert({workspace_id:WS.id,board_id:S.board,name:'To do',color:CYCLE[0],position:0}).select().single();
    if(error)throw error;

  }

}
async function planInsertTask(n,colId){
  const {data,error}=await sb.from('bbe_notes').insert({workspace_id:WS.id,board_id:S.board,column_id:colId,title:n.title,description:n.note||null,due_date:n.due_date||null,created_by:SESSION.user.id,position:cur.notes.filter(x=>x.column_id===colId).length}).select().single();
  if(error)throw error;
  cur.notes.push(data);
  const {error:e2}=await sb.from('bbe_plan_nodes').update({note_id:data.id}).eq('id',n.id);
  if(e2)throw e2;
  n.note_id=data.id;
}
async function planMakeTask(id){
  if(!canManage())return;
  const n=cur.planNodes.find(x=>x.id===id); if(!n)return;
  if(n.note_id){toast('Already a task');return;}
  try{
    const colId=await planFirstCol();
    await planInsertTask(n,colId);
    await loadBoard();render();toast('Added to the board');
  }catch(e){fail(e);}
}
async function planToBoard(){
  if(!canManage())return;
  const todo=cur.planNodes.filter(n=>!n.note_id&&(n.kind||'step')!=='post');
  if(!todo.length){toast('Every step is already on the board');return;}
  try{
    const frames=cur.planFrames||[];
    const frameFor=n=>{
      const cx=(Number(n.x)||0)+75,cy=(Number(n.y)||0)+27;
      return frames.find(f=>{const fx=Number(f.x)||0,fy=Number(f.y)||0;return cx>=fx&&cx<=fx+(Number(f.w)||0)&&cy>=fy&&cy<=fy+(Number(f.h)||0);});
    };
    const colCache={};
    const colFor=async f=>{
      const key=(f.name||'zone').trim().toLowerCase();
      if(colCache[key])return colCache[key];
      let col=cur.cols.find(c=>(c.name||'').trim().toLowerCase()===key);
      if(!col){
        const {data,error}=await sb.from('bbe_columns').insert({workspace_id:WS.id,board_id:S.board,name:(f.name||'Zone').trim(),color:f.color||CYCLE[cur.cols.length%CYCLE.length],position:cur.cols.length}).select().single();
        if(error)throw error;
        cur.cols.push(data); col=data;
      }
      colCache[key]=col.id; return col.id;
    };
    let firstCol=null,added=0;
    for(const n of todo){
      const f=frameFor(n);
      let colId;
      if(f)colId=await colFor(f);
      else{if(!firstCol)firstCol=await planFirstCol();colId=firstCol;}
      await planInsertTask(n,colId);added++;
    }
    await loadBoard();render();
    toast(added+' step'+(added!==1?'s':'')+' added to the board');
  }catch(e){fail(e);}
}
/* plan: cost → budget */
async function planPushBudget(){
  if(!canManage())return;
  const sums={};
  (cur.planNodes||[]).forEach(n=>{
    const c=Number(n.cost)||0,cat=(n.budget_cat||'').trim();
    if(c>0&&cat)sums[cat]=(sums[cat]||0)+c;
  });
  const names=Object.keys(sums);
  if(!names.length){toast('Add a cost and a budget category to steps first');return;}
  try{
    let pos=cur.budget.filter(b=>!b.parent_id).length;
    for(const name of names){
      const ex=cur.budget.find(b=>!b.parent_id&&(b.name||'').trim().toLowerCase()===name.toLowerCase());
      if(ex){const {error}=await sb.from('bbe_budget').update({planned:sums[name]}).eq('id',ex.id);if(error)throw error;}
      else{const {error}=await sb.from('bbe_budget').insert({workspace_id:WS.id,board_id:S.board,name,planned:sums[name],position:pos++});if(error)throw error;}
    }
    await loadBoard();render();
    toast('Budget updated from plan ('+names.length+(names.length!==1?' categories':' category')+')');
  }catch(e){fail(e);}
}

function planToggleChan(p){
  if(!_planChannels)_planChannels=[];
  const i=_planChannels.indexOf(p);
  if(i>=0)_planChannels.splice(i,1); else _planChannels.push(p);
  const g=$('pn-chans'); if(g)g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',_planChannels.includes(b.dataset.p)));
}
async function planInsertPosts(n,chans,date){
  for(const ch of chans){
    const {error}=await sb.from('bbe_posts').insert({workspace_id:WS.id,board_id:S.board,platform:ch,caption:(n.title+(n.note?('\n'+n.note):'')),media_note:null,media:[],post_date:date,post_time:'09:00',status:'draft',created_by:SESSION.user.id});
    if(error)throw error;
  }
  const {error:e2}=await sb.from('bbe_plan_nodes').update({scheduled:true}).eq('id',n.id);
  if(e2)throw e2;
  return chans.length;
}
async function planSchedulePost(id){
  if(!canManage())return;
  const n=cur.planNodes.find(x=>x.id===id); if(!n)return;
  const chans=($('pn-chans')&&_planChannels)?_planChannels:(n.channels||[]);
  const date=($('pn-due')&&($('pn-due').value||$('pn-start').value))||n.due_date||n.start_date;
  if(!chans.length){toast('Pick at least one channel for this post first');return;}
  if(!date){toast('Give this post a due or start date first');return;}
  try{
    const k=await planInsertPosts(n,chans,date);
    closeModal();
    await loadBoard();render();
    toast('Scheduled '+k+' post'+(k!==1?'s':'')+' to the calendar');
  }catch(e){fail(e);}
}
async function planScheduleAll(){
  if(!canManage())return;
  const todo=(cur.planNodes||[]).filter(n=>n.kind==='post'&&!n.scheduled&&(n.channels||[]).length&&(n.due_date||n.start_date));
  if(!todo.length){toast('No unscheduled posts with channels and a date');return;}
  try{
    let k=0;
    for(const n of todo)k+=await planInsertPosts(n,n.channels||[],n.due_date||n.start_date);
    await loadBoard();render();
    toast('Scheduled '+k+' post'+(k!==1?'s':'')+' to the calendar');
  }catch(e){fail(e);}
}

function planFrameDragStart(ev,id){
  if(ev.target.closest('.pframe-lbl,.pframe-rs,.pnode,button'))return;
  if(!canManage())return;
  const f=cur.planFrames.find(x=>x.id===id); if(!f)return;
  ev.preventDefault();
  const el=ev.currentTarget;
  _pf={id,el,sx:ev.clientX,sy:ev.clientY,ox:Number(f.x)||0,oy:Number(f.y)||0,moved:false};
  if(el.setPointerCapture)try{el.setPointerCapture(ev.pointerId);}catch(_){}
  el.onpointermove=e=>{
    if(!_pf)return;
    const dx=e.clientX-_pf.sx,dy=e.clientY-_pf.sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4)_pf.moved=true;
    if(!_pf.moved)return;
    el.style.left=Math.max(0,_pf.ox+dx)+'px';
    el.style.top=Math.max(0,_pf.oy+dy)+'px';
  };
  el.onpointerup=async e=>{
    el.onpointermove=null; el.onpointerup=null;
    const d=_pf; _pf=null; if(!d||!d.moved)return;
    const nx=Math.max(0,Math.round(d.ox+(e.clientX-d.sx))),ny=Math.max(0,Math.round(d.oy+(e.clientY-d.sy)));
    const f2=cur.planFrames.find(x=>x.id===id); if(f2){f2.x=nx;f2.y=ny;}
    render();
    try{const {error}=await sb.from('bbe_plan_frames').update({x:nx,y:ny}).eq('id',id);if(error)throw error;}catch(err){fail(err);}
  };
}
function planFrameResizeStart(ev,id){
  if(!canManage())return;
  const f=cur.planFrames.find(x=>x.id===id); if(!f)return;
  ev.preventDefault(); ev.stopPropagation();
  const el=ev.currentTarget,frameEl=el.closest('.pframe');
  const st={sx:ev.clientX,sy:ev.clientY,ow:Number(f.w)||340,oh:Number(f.h)||240};
  if(el.setPointerCapture)try{el.setPointerCapture(ev.pointerId);}catch(_){}
  el.onpointermove=e=>{
    const w=Math.max(160,Math.round(st.ow+(e.clientX-st.sx))),h=Math.max(120,Math.round(st.oh+(e.clientY-st.sy)));
    if(frameEl){frameEl.style.width=w+'px';frameEl.style.height=h+'px';}
  };
  el.onpointerup=async e=>{
    el.onpointermove=null; el.onpointerup=null;
    const w=Math.max(160,Math.round(st.ow+(e.clientX-st.sx))),h=Math.max(120,Math.round(st.oh+(e.clientY-st.sy)));
    const f2=cur.planFrames.find(x=>x.id===id); if(f2){f2.w=w;f2.h=h;}
    render();
    try{const {error}=await sb.from('bbe_plan_frames').update({w,h}).eq('id',id);if(error)throw error;}catch(err){fail(err);}
  };
}

function dueChip(n){
  if(!n.due_date)return '';
  const label=new Date(n.due_date+'T12:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short'});
  const days=Math.round((new Date(n.due_date+'T00:00:00Z')-new Date(saDate()+'T00:00:00Z'))/86400000);
  if(n.done)return `<span class="due" style="background:rgba(0,0,0,.06);color:var(--muted)">${ic('calendar',10)} ${label}</span>`;
  if(days<0)return `<span class="due" style="background:var(--danger);color:#fff">${ic('alert',10)} ${label} · ${-days}d over</span>`;
  if(days<=(n.warn_days??7))return `<span class="due" style="background:#FAEEDA;color:#854F0B">${ic('calendar',10)} ${label} · ${days===0?'today':days+'d'}</span>`;
  return `<span class="due" style="background:rgba(0,0,0,.06);color:var(--muted)">${ic('calendar',10)} ${label}</span>`;
}

/* ---- budget tab (categories + one level of sub-categories + notes) ---- */
function budgetModel(){
  const out=cur.invs.filter(i=>i.kind==='out');
  const byB={}; out.forEach(i=>{if(i.budget_id){(byB[i.budget_id]=byB[i.budget_id]||[]).push(i);}});
  const all=cur.budget;
  const kidsOf=pid=>all.filter(b=>b.parent_id===pid).sort((a,b)=>(a.position??0)-(b.position??0));
  const stat=list=>{const actual=_sumInv(list),paid=_sumInv((list||[]).filter(i=>i.paid));return{actual,paid,outstanding:actual-paid};};
  const leaf=b=>({id:b.id,name:b.name,note:b.note,parent_id:b.parent_id,type:'leaf',planned:Number(b.planned||0),...stat(byB[b.id])});
  const nodes=all.filter(b=>!b.parent_id).sort((a,b)=>(a.position??0)-(b.position??0)).map(p=>{
    const kids=kidsOf(p.id).map(leaf);
    if(!kids.length)return leaf(p);
    const direct=stat(byB[p.id]);
    const planned=kids.reduce((t,k)=>t+k.planned,0);
    const actual=kids.reduce((t,k)=>t+k.actual,0)+direct.actual;
    const paid=kids.reduce((t,k)=>t+k.paid,0)+direct.paid;
    return{id:p.id,name:p.name,note:p.note,type:'parent',kids,planned,actual,paid,outstanding:actual-paid};
  });
  const ids=new Set(all.map(b=>b.id));
  const uncatList=out.filter(i=>!i.budget_id||!ids.has(i.budget_id));
  return {nodes,uncat:{name:'Uncategorised',...stat(uncatList)}};
}
function _bStatus(planned,actual){
  if(actual>planned&&planned>=0&&(actual>0))return['⚠ over budget','var(--danger)'];
  if(planned>0&&actual===planned)return['◆ fully used','var(--warn)'];
  if(planned>0&&actual/planned>=0.85)return['◆ near limit','var(--warn)'];
  if(actual>0)return['● on track','var(--ok)'];
  return['○ untouched','var(--muted)'];
}
function _bBar(paid,outstanding,planned){
  const actual=paid+outstanding;const over=actual>planned&&actual>0;
  const color=over?'var(--danger)':(planned>0&&actual/planned>=0.85?'var(--warn)':'var(--ok)');
  const w=planned>0?Math.min(actual,planned)/planned:0;
  const pw=planned>0?Math.min(paid,planned)/planned:0;
  const dw=Math.max(0,w-pw);
  const pct=planned>0?Math.round(actual/planned*100)+'%':(actual>0?'—':'0%');
  return `<div class="barwrap"><div class="track"><div class="fill" style="width:${(pw*100).toFixed(1)}%;background:${color}"></div><div class="fill" style="width:${(dw*100).toFixed(1)}%;background:${color};opacity:.45"></div></div><span class="pct" style="${over?'color:var(--danger)':''}">${pct}</span></div>`;
}
function _bAct(n){return `<span class="blab">Actual</span><span class="bnum">${Rand(n.actual)}</span><span class="autotag">auto</span>
    <span class="bsub"><span style="color:var(--ok)">${Rand(n.paid)} paid</span>${n.outstanding>0?` · <span style="color:var(--warn)">${Rand(n.outstanding)} due</span>`:''}</span>`;}
function _bRem(planned,actual){const rem=planned-actual;const col=rem<0?'var(--danger)':rem===0?'var(--warn)':'var(--ok)';return `<span class="blab">Remaining</span><span class="bnum" style="color:${col}">${rem<0?'−'+Rand(-rem):Rand(rem)}</span>`;}
function _bNoteHtml(note){return note?`<div style="font-size:11px;color:var(--muted);margin-top:2px;font-style:italic">${esc(note)}</div>`:'';}
function _bActions(id,opts){

function _bParentRow(n){

        ${_bNoteHtml(n.note)}

      <div class="br"><span class="blab">Planned</span><span class="bnum">${Rand(n.planned)}</span><span class="autotag">Σ subs</span></div>
      <div class="br">${_bAct(n)}</div>
      <div class="br">${_bRem(n.planned,n.actual)}</div>
    </div>
    ${_bBar(n.paid,n.outstanding,n.planned)}
  </div>${exp?n.kids.map(k=>_bLeafRow(k,true)).join(''):''}`;
}

  const addRow=canManage()?`<div class="baddrow">

function budgetSelectOptions(sel){
  const all=cur.budget;

  parents.forEach(p=>{

      o+=`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)} (whole)</option>`;

    }else o+=`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)}</option>`;
  });
  return o;
}

async function draftAI(){
  const brief=$('po-cap').value.trim()||prompt('What is this post about? One or two lines:');
  if(!brief)return;
  const cap=$('po-cap'); cap.value='✦ Drafting…'; cap.disabled=true;
  try{
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch(`${SUPABASE_URL}/functions/v1/bbe-draft`,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({workspace_id:WS.id,board_id:S.board,platform:$('po-plat').value,brief})});
    const j=await res.json();
    if(j.error==='OUT_OF_CREDITS'){cap.value=brief;cap.disabled=false;toast(j.message||'Out of AI credits — top up in Settings');return;}
    if(!res.ok||j.error)throw new Error(j.error||'Drafting failed');
    cap.value=j.text;
    if(typeof j.credits_left==='number'){_credits=j.credits_left;toast(`✦ Drafted — ${j.credits_left} credits left`);}
  }catch(e){cap.value=brief;fail(e);}
  cap.disabled=false;
}
async function scoreDraft(pid){
  const text=($('po-cap')&&$('po-cap').value||'').trim(); const platform=$('po-plat')?$('po-plat').value:'other';
  const out=$('po-score');
  if(!text){if(out)out.innerHTML=' <span style="color:var(--danger);font-size:11.5px">Add a caption first.</span>';return;}
  if(out)out.innerHTML=' <span style="font-size:11.5px;color:var(--muted)">✦ Scoring…</span>';
  const r=await anApi({action:'score',text,platform,post_id:pid});
  if(!r||!r.ok){if(out)out.innerHTML=' <span style="color:var(--danger);font-size:11.5px">'+esc((r&&(r.message||r.error))||'Could not score')+'</span>';return;}
  const sc=Math.round(r.score||0); const col=sc>=66?'var(--ok)':(sc>=40?'#C7952b':'var(--danger)');
  const v=r.verdict||{}; const tips=(v.tips||[]).map(t=>`<li>${esc(t)}</li>`).join('');
  if(out)out.innerHTML=`<div style="margin-top:8px;padding:9px 11px;border-radius:9px;background:var(--panel,#F4F3EE)"><div style="display:flex;align-items:center;gap:8px"><b style="color:${col};font-size:16px">${sc}/100</b><span style="font-size:12px">${esc(v.verdict||'')}</span>${r.cached?'<span style="font-size:10px;color:var(--muted)">· cached</span>':''}</div>${tips?`<ul style="margin:6px 0 0;padding-left:18px;font-size:11.5px;color:var(--muted)">${tips}</ul>`:''}</div>`;
}
let _postMedia=[];
function mediaThumb(m,ix){
  return `<span style="position:relative;display:inline-block">${m.type==='image'?`<img src="${m.url}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`:`<span style="display:flex;width:64px;height:64px;border-radius:8px;background:var(--panel,#F4F3EE);align-items:center;justify-content:center;font-size:22px;border:1px solid var(--line)">🎬</span>`}
  <button type="button" onclick="_postMedia.splice(${ix},1);document.getElementById('po-thumbs').innerHTML=_postMedia.map(mediaThumb).join('')" style="position:absolute;top:-6px;right:-6px;background:var(--ink,#23241f);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1">✕</button></span>`;
}
async function uploadPostMedia(files){
  const st=document.getElementById('po-upl');
  for(const f of files){
    if(f.size>50*1024*1024){toast(f.name+' is over 50MB');continue;}
    st.textContent='Uploading '+f.name+'…';
    const path=WS.id+'/'+Date.now()+'-'+f.name.replace(/[^\w.\-]+/g,'_');
    const {error}=await sb.storage.from('post-media').upload(path,f,{upsert:true});
    if(error){toast('Upload failed: '+error.message);continue;}
    const {data}=sb.storage.from('post-media').getPublicUrl(path);
    _postMedia.push({type:f.type.startsWith('video')?'video':'image',url:data.publicUrl});
  }
  st.textContent='';
  document.getElementById('po-thumbs').innerHTML=_postMedia.map(mediaThumb).join('');
}
async function savePost(id){
  const row={workspace_id:WS.id,board_id:S.board,platform:$('po-plat').value,caption:$('po-cap').value.trim(),
    media_note:$('po-media').value.trim(),post_date:$('po-date').value,post_time:$('po-time').value||'09:00',
    status:$('po-status').value,created_by:SESSION.user.id,media:_postMedia};

    else{const {error}=await sb.from('bbe_posts').insert(row);if(error)throw error;}

// Publish IMMEDIATELY from the composer — works on a brand-new (unsaved) post too.
// Facebook / Instagram / Threads go live now; TikTok uploads the video to the
// creator's TikTok inbox as a DRAFT (Content Posting API) to caption & publish in-app.
async function postNowComposer(existingId){
  const platform=$('po-plat').value;
  const caption=$('po-cap').value.trim();
  const media=_postMedia.filter(m=>m&&m.url);
  const nm=(PLAT[platform]||PLAT.other)[0];
  if(!['facebook','instagram','threads','tiktok'].includes(platform)){
    toast('Post now works for Facebook, Instagram, Threads and TikTok. For '+nm+', set the status to Scheduled instead.');return;
  }
  if(platform==='tiktok'&&!media.find(m=>m.type==='video')){toast('TikTok needs a video attached — add one under Images / video first.');return;}
  if(platform==='instagram'&&!media.find(m=>m.type==='image'||m.type==='video')){toast('Instagram needs an image or video attached first.');return;}
  if((platform==='facebook'||platform==='threads')&&!caption&&!media.length){toast('Add a caption or media first.');return;}
  const ask=platform==='tiktok'?'Upload this video to your TikTok inbox as a draft now?':('Publish this to '+nm+' live right now?');
  if(!confirm(ask))return;
  const row={workspace_id:WS.id,board_id:S.board,platform,caption,media_note:$('po-media').value.trim(),
    post_date:$('po-date').value||saDate(),post_time:$('po-time').value||'09:00',created_by:SESSION.user.id,media:_postMedia};
  let id=existingId;
  try{
    if(id){const {error}=await sb.from('bbe_posts').update(row).eq('id',id);if(error)throw error;}
    else{const {data,error}=await sb.from('bbe_posts').insert(row).select('id').single();if(error)throw error;id=data.id;}
  }catch(e){fail(e);return;}
  try{
    let j;
    if(platform==='facebook'){toast('Posting to Facebook…');j=await metaApi({action:'publish',board_id:S.board,message:caption});}
    else if(platform==='instagram'){const img=media.find(m=>m.type==='image');const vid=media.find(m=>m.type==='video');toast('Posting to Instagram…');j=await igApi({action:'publish',caption,image_url:img?img.url:'',video_url:vid?vid.url:''});}
    else if(platform==='threads'){const img=media.find(m=>m.type==='image');const vid=media.find(m=>m.type==='video');toast('Posting to Threads…');j=await thApi({action:'publish',board_id:S.board,caption,image_url:img?img.url:'',video_url:vid?vid.url:''});}
    else if(platform==='tiktok'){const vid=media.find(m=>m.type==='video');toast('Uploading to TikTok…');j=await ttApi({action:'publish',board_id:S.board,caption,video_url:vid.url});}
    if(j&&j.error){toast('⚠ '+(j.message||j.error));return;}
    await sb.from('bbe_posts').update({status:'posted',post_url:(j&&j.permalink)||null}).eq('id',id);
    closeModal();await loadBoard();render();
    if(platform==='tiktok')toast('✓ Uploaded to your TikTok inbox as a draft — open the TikTok app to add a caption and publish it.');
    else toast('Posted to '+nm+' — live now',(j&&j.permalink)?'Open ↗':null,(j&&j.permalink)?()=>window.open(j.permalink,'_blank'):null);
  }catch(e){fail(e);}
}
async function delPost(id){
  const p=(cur.posts||[]).find(x=>x.id===id);
  try{await sb.from('bbe_posts').delete().eq('id',id);const copy={...p};cur.posts=cur.posts.filter(x=>x.id!==id);closeModal();render();
  toast('Post removed','Undo',async()=>{await sb.from('bbe_posts').insert(copy);await loadBoard();render();});}catch(e){fail(e);}
}
async function copyCaption(id){
  const p=(cur.posts||[]).find(x=>x.id===id); if(!p)return;
  try{await navigator.clipboard.writeText(p.caption);toast('Caption copied — paste it straight into the app');}catch(_){toast('Could not copy');}
}

/* ============ CONNECTED SOCIALS (PostPeer) ============ */
let _socAccounts=null;
// Base platform names (facebook/instagram/threads/youtube/tiktok) this board is DIRECTLY
// connected to via our own apps (not PostPeer). Populated by loadDirectLinks().
let _directPlatforms=[];
let _directNames={}; // platform -> connected account name/handle (best effort, for hover tooltips)
async function socialApi(body){
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(`${SUPABASE_URL}/functions/v1/bbe-social`,{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${session.access_token}`},
    body:JSON.stringify({workspace_id:WS.id,...body})});
  return await res.json();
}
let _cbUsed=0,_cbAllowed=1,_socRenderedFor=null;
async function loadSocials(){
  if(!S.board){_socAccounts=[];return;}
  try{const j=await socialApi({action:'accounts',board_id:S.board});
  _socAccounts=j.ok?(j.accounts||[]):[];
  if(j.content_boards_used!==undefined){_cbUsed=j.content_boards_used;_cbAllowed=j.content_boards_allowed;}
  const el=$('soc-list'); if(el)el.innerHTML=socListHtml();
  loadInboxConnects();
  // Re-render once per board when social accounts first load (so the "posts to" strip reflects them).
  // Guard on the board id — NOT on a #perf-card element (that strip was removed in the analytics
  // redesign, so the old check was always true and looped render() → loadSocials() → render() forever.)
  if(S.view==='content'&&_socRenderedFor!==S.board){_socRenderedFor=S.board;render();}}catch(_){_socAccounts=[];}
}
function socListHtml(){
  if(_socAccounts===null)return '<div class="empty">Checking connections…</div>';
  if(!_socAccounts.length)return '<div class="empty">Nothing connected yet — pick a platform below. A window opens where you sign in and approve; then it posts on your behalf.</div>';
  return _socAccounts.map(a=>`<div style="display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--line)">
    <span class="pill" style="background:${(PLAT[a.platform]||PLAT.other)[1]}">${(PLAT[a.platform]||PLAT.other)[0]}</span>
    <span style="flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.user||'connected account')}</span>
    <span style="font-size:11px;color:var(--ok);font-weight:700;flex:none">● live</span>
    ${canManage()?`<button class="btn ghost sm" style="color:var(--danger);flex:none;padding:3px 9px" title="Disconnect this account" onclick="disconnectSocial('${a.id}')">✕</button>`:''}
  </div>`).join('');
}
function socStripChips(){
  const shown=new Set();
  // PostPeer accounts (existing behaviour, keeps its per-account disconnect ✕).
  const items=(_socAccounts||[]).map(a=>{
    shown.add(a.platform);
    const nm=(PLAT[a.platform]||PLAT.other)[0];
    const tip=nm+(a.user?' · '+a.user:'');
    return `<span class="socic" title="${esc(tip)}">${platBadge(a.platform,26)}${canManage()?`<b class="x" title="Disconnect ${esc(nm)}" onclick="disconnectSocial('${a.id}')">✕</b>`:''}</span>`;
  });
  // Directly-connected platforms (our own apps) not already shown via PostPeer — de-duped.
  // Each carries its own disconnect ✕ (routes via directDisconnect -> the matching direct API).
  for(const pl of (_directPlatforms||[])){
    if(shown.has(pl))continue; shown.add(pl);
    const nm=(PLAT[pl]||PLAT.other)[0];
    const acc=(_directNames||{})[pl];
    const tip=nm+(acc?' · '+acc:' · connected');
    items.push(`<span class="socic" title="${esc(tip)}">${platBadge(pl,26)}${canManage()?`<b class="x" title="Disconnect ${esc(nm)}" onclick="directDisconnect('${pl}')">✕</b>`:''}</span>`);
  }
  const html=items.join('');
  return html?`<span style="display:inline-flex;gap:9px;align-items:center;vertical-align:middle">${html}</span>`:'';
}
async function disconnectSocial(id){
  const a=(_socAccounts||[]).find(x=>x.id===id); if(!a)return;
  if(!confirm(`Disconnect ${a.user||a.platform} from this board? Auto-posting to it stops immediately. You can reconnect any time.`))return;
  try{
    const j=await socialApi({action:'disconnect',board_id:S.board,account_id:id});
    if(j.error){toast(j.message||j.error);return;}
    await loadSocials();
    const strip=$('soc-strip');
    if(strip)strip.innerHTML=socStripChips()||'<span style="font-size:12.5px;color:var(--muted)">nothing yet — connect below</span>';
    toast(`Disconnected ${j.user||a.user||a.platform}`);
  }catch(e){fail(e);}
}
// Disconnect a DIRECTLY-connected platform (our own apps) from the current board.
// Facebook & Instagram share one Meta connection (IG rides on the FB Page), so
// disconnecting either removes both together.
async function directDisconnect(pl){
  const nm=(PLAT[pl]||PLAT.other)[0];
  const metaPair=(pl==='facebook'||pl==='instagram');
  const msg=metaPair
    ? 'Disconnect Facebook & Instagram from this board? They share one Meta connection, so both stop together. Auto-posting and Inbox for them stop immediately. You can reconnect any time.'
    : `Disconnect ${nm} from this board? Auto-posting to it stops immediately. You can reconnect any time.`;
  if(!confirm(msg))return;
  try{
    let j;
    if(pl==='tiktok')j=await ttApi({action:'disconnect',board_id:S.board});
    else if(pl==='threads')j=await thApi({action:'disconnect',board_id:S.board});

// Build the set of platforms the CURRENT board is DIRECTLY connected to (our own apps,
// not PostPeer), de-duped to base names: facebook, instagram, threads, youtube, tiktok.
// Sources: bbe-meta links (_inboxLinks: facebook/instagram/threads/youtube by-handle),
// bbe-threads links, bbe-youtube-post links (platform youtube_oauth -> base 'youtube'),
// and bbe-tiktok links.
async function loadDirectLinks(){
  if(!S.board){_directPlatforms=[];_directNames={};return;}
  const board=S.board;
  const set=new Set();
  const names={};
  // best-effort account name from a link record (handles vary by provider)
  const nmeOf=l=>(l&&(l.name||l.username||l.display_name||l.handle||l.account_name||l.title||l.page_name||l.user||''))||'';
  // Ensure the meta links (facebook/instagram/threads/youtube-by-handle) are loaded.
  if(_inboxLinks===null){try{await loadInboxConnects();}catch(_){}}
  for(const l of (_inboxLinks||[])){
    if(l.board_id!==board)continue;
    if(l.platform==='facebook'){set.add('facebook'); if(nmeOf(l))names.facebook=nmeOf(l);}
    else if(l.platform==='instagram'){set.add('instagram'); if(nmeOf(l))names.instagram=nmeOf(l);}
    else if(l.platform==='threads'){set.add('threads'); if(nmeOf(l))names.threads=nmeOf(l);}
    // NOTE: YouTube posts via PostPeer (shows through _socAccounts), so it is NOT a
    // "direct" platform. The by-handle reader is a comment-only Inbox connection.
  }
  // Instagram rides the FB Page (shared Meta connection) — fall back to the Page name.
  if(set.has('instagram')&&!names.instagram&&names.facebook)names.instagram=names.facebook;
  // Threads — dedicated endpoint (in case meta links doesn't carry it).
  try{const j=await thApi({action:'links'}); const l=((j&&j.links)||[]).find(x=>x.board_id===board); if(l){set.add('threads'); if(nmeOf(l))names.threads=nmeOf(l);}}catch(_){}
  // TikTok (bbe-tiktok).
  try{const j=await ttApi({action:'links'}); const l=((j&&j.links)||[]).find(x=>x.board_id===board); if(l){set.add('tiktok'); if(nmeOf(l))names.tiktok=nmeOf(l);}}catch(_){}
  _directPlatforms=[...set];
  _directNames=names;
}

    const tip=label+(l.name?' · '+l.name:' connected');

    icons.push(`<span class="socic" title="${esc(tip)}">${platBadge(pl,24)}${canDisc?`<b class="x" title="Disconnect ${label}" onclick="inboxDisconnect('${pl}')">✕</b>`:''}</span>`);
  }

function emlClean(t){
  t=String(t||'');
  t=t.replace(/<!--[\s\S]*?-->/g,' ');
  t=t.replace(/<!\[[^\]]*\]>/g,' ').replace(/<!\[[^\]]*$/g,' ');
  t=t.replace(/\[if[^\]]*\]/gi,' ').replace(/<!--|-->|<!\[|\]>/g,' ');
  t=t.replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<script[\s\S]*?<\/script>/gi,' ');
  t=t.replace(/<[^>]*>/g,' ');
  t=t.replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/&#39;|&rsquo;|&lsquo;/gi,"'").replace(/&quot;|&ldquo;|&rdquo;/gi,'"').replace(/&mdash;/gi,'—').replace(/&middot;/gi,'·').replace(/&[a-z]+;/gi,' ');
  t=t.replace(/https?:\/\/\S{45,}/g,'[link]');
  t=t.replace(/[ \t]+/g,' ').replace(/\s*\n\s*\n\s*/g,'\n\n').replace(/[ \n]{3,}/g,' ').trim();
  return t;
}
function emlParts(i){
  let t=String(i.text||''); let subj='';
  const m=t.match(/^Subject:[ \t]*([^\r\n]*)/);
  if(m){subj=m[1].trim(); t=t.slice(m[0].length);}
  return {subj, body:emlClean(t)};
}

const AN_SRC=['tiktok','instagram','facebook','youtube','threads','social'];
const AN_SRCMAP={tiktok:'tiktok',instagram:'instagram',facebook:'facebook',youtube:'youtube',threads:'threads',social:'linkedin'};
async function anLoadPlatforms(){

    const d60=new Date(Date.now()-60*864e5).toISOString().slice(0,10);

    const bySrc={};
    for(const r of data){const s=r.source,m=r.metric;(bySrc[s]=bySrc[s]||{});(bySrc[s][m]=bySrc[s][m]||[]).push({d:r.captured_for,v:Number(r.value)||0});}
    const d30=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
    const dayList=[];for(let i=29;i>=0;i--)dayList.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10));
    const latest=a=>a&&a.length?a[a.length-1].v:0;
    const agoVal=a=>{if(!a)return null;let v=null;for(const p of a){if(p.d<=d30)v=p.v;}return v;};
    const series30=a=>{if(!a||!a.length)return dayList.map(d=>({d,v:0}));const map={};a.forEach(p=>map[p.d]=p.v);let last=0;for(const p of a){if(p.d<dayList[0])last=p.v;}return dayList.map(d=>{if(map[d]!=null)last=map[d];return {d,v:last};});};

      if(!METR.some(m=>t[m]>0))continue;

    }

    const sumSeriesFor=metric=>{const per=AN_SRC.map(s=>bySrc[s]&&bySrc[s][metric]?series30(bySrc[s][metric]):null).filter(Boolean);return dayList.map((d,i)=>({d,v:per.reduce((a,arr)=>a+(arr[i]?arr[i].v:0),0)}));};
    const sumAgo=metric=>{let tot=0,any=false;for(const s of AN_SRC){const a=agoVal(bySrc[s]&&bySrc[s][metric]);if(a!=null){tot+=a;any=true;}}return any?tot:null;};
    ['reach','impressions','views','posts'].forEach(m=>{kpiSeries[m]=sumSeriesFor(m);const ago=sumAgo(m);kpiDelta[m]=(ago&&ago>0)?Math.round((totals[m]-ago)/ago*100):null;});

  }catch(e){/* keep empty _anPlat */}
}

async function publishPost(id){
  const p=(cur.posts||[]).find(x=>x.id===id); if(!p)return;
  if(!confirm(`Send "${(p.caption.split('\n')[0]||'this post').slice(0,60)}" to ${(PLAT[p.platform]||PLAT.other)[0]} — ${p.post_date} at ${(p.post_time||'09:00').slice(0,5)}?`))return;
  const when=new Date(`${p.post_date}T${(p.post_time||'09:00').slice(0,5)}:00+02:00`);
  const postNow=when.getTime()<=Date.now()+60000;
  const media=Array.isArray(p.media)?p.media.filter(m=>m&&m.url):[];
  try{
    // Post-now on Facebook / Instagram goes DIRECT through our Meta app (no PostPeer).
    if(postNow && p.platform==='facebook'){
      toast('Posting to Facebook…');
      const j=await metaApi({action:'publish',board_id:S.board,message:p.caption});
      if(j&&j.error){toast('⚠ '+(j.message||j.error));return;}
      await sb.from('bbe_posts').update({status:'posted',post_url:j.permalink||null}).eq('id',id);
      closeModal();await loadBoard();render();
      toast('Posted to Facebook — live now',j.permalink?'Open ↗':null,j.permalink?()=>window.open(j.permalink,'_blank'):null);
      return;
    }
    if(postNow && p.platform==='instagram'){
      const img=media.find(m=>m.type==='image'); const vid=media.find(m=>m.type==='video');
      if(!img&&!vid){toast('Instagram needs an image or video attached to publish.');return;}
      toast('Posting to Instagram…');
      const j=await igApi({action:'publish',caption:p.caption,image_url:img?img.url:'',video_url:vid?vid.url:''});
      if(j&&j.error){toast('⚠ '+(j.message||j.error));return;}
      await sb.from('bbe_posts').update({status:'posted'}).eq('id',id);
      closeModal();await loadBoard();render();
      toast('Posted to Instagram — live now');
      return;
    }
    // Post-now on Threads goes DIRECT through our own Threads app (no PostPeer).
    if(postNow && p.platform==='threads'){
      const img=media.find(m=>m.type==='image'); const vid=media.find(m=>m.type==='video');
      toast('Posting to Threads…');
      const j=await thApi({action:'publish',board_id:S.board,caption:p.caption,image_url:img?img.url:'',video_url:vid?vid.url:''});
      if(j&&j.error){toast('⚠ '+(j.message||j.error));return;}
      await sb.from('bbe_posts').update({status:'posted',post_url:j.permalink||null}).eq('id',id);
      closeModal();await loadBoard();render();
      toast('Posted to Threads — live now',j.permalink?'Open ↗':null,j.permalink?()=>window.open(j.permalink,'_blank'):null);
      return;
    }
    // YouTube posting stays on PostPeer (falls through to the PostPeer path below) —
    // this keeps the restricted youtube.upload scope (and Google's CASA assessment) off
    // Brand Expert. Brand Expert only reads YouTube comments (Inbox) + analytics.
    // Post-now on TikTok uploads the video to the creator's TikTok inbox as a DRAFT
    // via bbe-tiktok (Content Posting API, video.upload). Needs a video. The creator
    // opens the TikTok app and taps once to caption + publish it.
    if(postNow && p.platform==='tiktok'){
      const vid=media.find(m=>m.type==='video');
      if(!vid){toast('TikTok needs a video to publish.');return;}
      toast('Uploading to TikTok…');
      const j=await ttApi({action:'publish',board_id:S.board,caption:p.caption,video_url:vid.url});
      if(j&&j.error){toast('⚠ '+(j.message||j.error));return;}
      await sb.from('bbe_posts').update({status:'posted'}).eq('id',id);
      closeModal();await loadBoard();render();
      toast('✓ Uploaded to your TikTok inbox as a draft — open the TikTok app to add a caption and publish it.');
      return;
    }
    // Future Facebook / Instagram / Threads / TikTok posts schedule NATIVELY through
    // our own apps (no PostPeer): we mark the post 'scheduled' and a cron publishes it at the set time.
    // (YouTube is NOT here — it schedules through PostPeer via the path below.)
    if(p.platform==='facebook'||p.platform==='instagram'||p.platform==='threads'||p.platform==='tiktok'){
      if(p.platform==='instagram'&&!media.find(m=>m.type==='image'||m.type==='video')){
        toast('Instagram needs an image or video attached to schedule.');return;
      }
      // TikTok schedules natively too, but requires a video (mirrors the IG guard).
      if(p.platform==='tiktok'&&!media.find(m=>m.type==='video')){
        toast('TikTok needs a video attached to schedule.');return;
      }
      await sb.from('bbe_posts').update({status:'scheduled'}).eq('id',id);
      closeModal();await loadBoard();render();
      toast('⏱ Scheduled — it posts itself at '+(p.post_time||'09:00').slice(0,5)+' on '+p.post_date);
      return;
    }
    // Everything else (TikTok/LinkedIn/etc.) still goes through PostPeer's scheduler.
    toast('Sending to the scheduler…');
    const j=await socialApi({action:'publish',post_id:id});
    if(j.error==='NO_ACCOUNTS'){toast(j.message);return;}
    if(j.error){toast('⚠ '+(j.message||j.error));return;}
    closeModal();await loadBoard();render();
    toast(j.scheduled?'⏱ Scheduled — it posts itself at the set time':'Posted! It is live now');
  }catch(e){fail(e);}
}

function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    const done=document.querySelector(`script[data-once="${src}"]`);
    if(done&&done.dataset.loaded==='1'){resolve();return;}
    if(done){done.addEventListener('load',()=>resolve());done.addEventListener('error',()=>reject(new Error('load failed')));return;}
    const s=document.createElement('script');
    s.src=src; s.async=true; s.setAttribute('data-once',src);
    s.onload=()=>{s.dataset.loaded='1';resolve();};
    s.onerror=()=>reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}

  if(/\.(txt|md|markdown|csv|json|html|htm)$/.test(name))return await file.text();
  if(name.endsWith('.docx')){
    if(typeof window.mammoth==='undefined')await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    const {value}=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return value||'';
  }
  if(name.endsWith('.pdf')){
    if(typeof window.pdfjsLib==='undefined'){
      await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const pages=[];
    for(let i=1;i<=doc.numPages;i++){
      const pg=await doc.getPage(i);
      const tc=await pg.getTextContent();
      pages.push(tc.items.map(it=>it.str).join(' '));
    }
    return pages.join('\n\n');
  }
  return await file.text();
}
async function ibFilesPicked(ev){
  const files=Array.from((ev.target&&ev.target.files)||[]);
  if(!files.length)return;
  const note=$('ib-files-note'); if(note)note.textContent='Reading files…';
  const ta=$('ib-brief');
  let cur=ta?ta.value:_ibBrief;
  let ok=0;
  for(const f of files){
    try{
      let text=await ibReadFileText(f);
      text=(text||'').trim();
      if(!text)continue;
      cur=(cur?cur:'')+`\n\n----- ${f.name} -----\n`+text;
      if(cur.length>40000)cur=cur.slice(0,40000);
      if(ta)ta.value=cur; _ibBrief=cur;
      ok++;
    }catch(e){toast(`Couldn't read ${f.name} — paste its text instead`);}
  }
  if(ta){ta.value=cur;} _ibBrief=cur;
  if(note)note.textContent='';
  if(ev.target)ev.target.value='';
  ibCount();
  if(ok)toast(`Added text from ${ok} file(s)`);
}

async function importBriefGenerate(){
  const brief=($('ib-brief')?$('ib-brief').value:'').trim();

}
function ibReview(){
  const d=_ibData; if(!d)return;
  const rowS='display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:7px';
  const cbS='width:16px;height:16px;flex:none;accent-color:var(--accent);cursor:pointer';
  const empty=!d.tasks.length&&!d.posts.length&&!(d.plan&&d.plan.nodes&&d.plan.nodes.length);
  openModal(`<h3>Import a brief</h3>
    ${d.summary?`<div style="font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5">${esc(d.summary)}</div>`:''}
    ${empty?'<div class="empty" style="text-align:center;padding:30px 10px">Nothing could be extracted — try a more detailed brief.</div>':''}
    ${d.tasks.length?`<label>Tasks (${d.tasks.length})</label>
      ${d.tasks.map((t,i)=>`<div style="${rowS}">

        ${t.due_in_days>0?`<span style="flex:none;font-size:11px;font-weight:600;color:var(--muted)">· due in ${t.due_in_days}d</span>`:''}
      </div>`).join('')}`:''}
    ${d.posts.length?`<label>Content drafts (${d.posts.length})</label>
      ${d.posts.map((p,i)=>{const pm=(typeof PLAT!=='undefined'&&PLAT[p.platform])?PLAT[p.platform]:null;
        return `<div style="${rowS}">
        <input type="checkbox" id="ib-p-${i}" checked style="${cbS}">
        <span class="pill" style="flex:none;background:${pm?pm[1]:'var(--muted)'}">${esc(pm?pm[0]:(p.platform||'?'))}</span>
        <span style="flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(((p.caption||'').split('\n')[0]).slice(0,80))}</span>
      </div>`;}).join('')}`:''}
    ${(d.plan&&d.plan.nodes&&d.plan.nodes.length)?`<label>Plan canvas</label>
      <div style="${rowS}">
        <input type="checkbox" id="ib-plan" style="${cbS}">
        <span style="flex:1;min-width:0;font-size:13.5px;font-weight:600">Build a Plan canvas — ${d.plan.nodes.length} steps</span>
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin:-2px 0 4px 2px">A visual left-to-right map of the campaign on the board's Plan tab.</div>`:''}
    <div class="row">
      <button class="btn ghost" onclick="ibShowForm()">Back</button>
      ${empty?'':`<button class="btn accent" id="ib-add" onclick="importBriefConfirm()">Add to board</button>`}

}
async function importBriefConfirm(){
  const d=_ibData; if(!d){toast('Nothing to add');return;}
  const tasks=d.tasks.filter((t,i)=>{const c=$('ib-t-'+i);return c&&c.checked;});
  const posts=d.posts.filter((p,i)=>{const c=$('ib-p-'+i);return c&&c.checked;});
  const wantPlan=!!(document.getElementById('ib-plan')&&document.getElementById('ib-plan').checked);
  if(!tasks.length&&!posts.length&&!wantPlan){toast('Tick at least one item to add');return;}
  const b=$('ib-add'); if(b){b.disabled=true;b.textContent='Adding…';}
  try{
    const j=await importBriefApi({action:'import',tasks,posts,want_tasks:tasks.length>0,want_posts:posts.length>0,want_plan:wantPlan,plan:wantPlan?_ibData.plan:undefined,platform_default:_ibPlat});
    if(j&&j.error){toast(j.message||j.error);if(b){b.disabled=false;b.textContent='Add to board';}return;}
    closeModal(); _ibData=null; _ibBrief='';
    toast(`Added ${(j&&j.tasks_added)||0} tasks, ${(j&&j.posts_added)||0} drafts${(j&&j.plan_added)?`, ${j.plan_added}-step plan`:''}`);

/* ============ MODAL / REALTIME / BOOT ============ */
function openModal(html){$('modal').innerHTML=html;$('overlay').classList.add('open');enhancePasswords();}
function closeModal(){$('overlay').classList.remove('open');}
$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
let rt=null,rtT=null;
function subscribeRealtime(){
  if(rt)sb.removeChannel(rt);
  rt=sb.channel('bbe-changes').on('postgres_changes',{event:'*',schema:'public'},p=>{
    if(!p.table||!p.table.startsWith('bbe_'))return;
    clearTimeout(rtT);
    rtT=setTimeout(()=>{if($('overlay').classList.contains('open'))return;refresh();},600);
  }).subscribe();
}
async function boot(){
  try{
    await loadWs();
    if(WS){await loadBoard();await ensureToday();subscribeRealtime();
      if(WS.plan!=='basic')loadCredits().then(render);
      waApi({action:'links'}).then(w=>{_waAccounts=(w&&w.ok)?(w.accounts||[]):(_waAccounts||[]);render();}).catch(()=>{});}
    render();
  }catch(e){fail(e);render();}
}
let _linkToken=null;
async function authLinkCheck(){
  const q=new URLSearchParams(location.search);
  const confirm=q.get('confirm'), pwreset=q.get('pwreset');
  const fbc=q.get('fbconnected');
  if(fbc){history.replaceState({},'',location.pathname);setTimeout(()=>toast(fbc==='err'?'Facebook connection failed — try again':'✅ Facebook Page linked — comments & messages will now land in your Inbox'),800);}
  // Direct YouTube posting (bbe-youtube-post) OAuth return.
  const ytc=q.get('ytconnected');
  if(ytc){history.replaceState({},'',location.pathname);setTimeout(()=>toast(ytc==='err'?'YouTube connection failed — try again':'✅ YouTube channel connected — you can now post & schedule to it'),800);}
  // TikTok (bbe-tiktok) OAuth return.
  const ttc=q.get('ttconnected');
  if(ttc){history.replaceState({},'',location.pathname);setTimeout(()=>toast(ttc==='err'?'TikTok connection failed — try again':'✅ TikTok connected — you can now post & schedule to it'),800);}
  const gm=q.get('gmail');
  if(gm){history.replaceState({},'',location.pathname);const gmEmail=q.get('email')||'';const gmReason=q.get('reason')||'';setTimeout(()=>{if(gm==='connected'){toast('✅ Gmail connected'+(gmEmail?' — '+gmEmail:'')+' — new mail will land in your Inbox');if(typeof loadInbox==='function'){loadInbox().then(()=>{if(typeof render==='function')render();});}}else{toast('Gmail sign-in didn\'t finish'+(gmReason?' ('+gmReason+')':'')+' — please try again');}},800);}
  const msc=q.get('ms');
  if(msc){history.replaceState({},'',location.pathname);const msEmail=q.get('email')||'';const msReason=q.get('reason')||'';setTimeout(()=>{if(msc==='connected'){toast('✅ Microsoft/Outlook connected'+(msEmail?' — '+msEmail:'')+' — new mail will land in your Inbox');if(typeof loadInbox==='function'){loadInbox().then(()=>{if(typeof render==='function')render();});}}else{toast('Microsoft sign-in didn\'t finish'+(msReason?' ('+msReason+')':'')+' — please try again');}},800);}
  if(!confirm&&!pwreset)return false;
  history.replaceState({},'',location.pathname);
  // The token is only consumed when the person clicks — email security scanners
  // that pre-open links can't burn it.
  _linkToken=confirm||pwreset;
  const app=$('app');
  if(pwreset){
    app.innerHTML=`<div class="auth"><div class="auth-card">
      <h3>Set a new password</h3>
      <div class="auth-err" id="a-err"></div>
      <label>New password (min 8)</label>${pwField('rp-new','new-password',null)}
      <button class="btn accent" style="width:100%;justify-content:center;padding:12px;margin-top:18px" id="rp-go" onclick="doLinkReset()">Save my new password</button>
      <div style="text-align:center;font-size:12px;margin-top:14px;color:var(--muted)">Link expired? <button style="color:var(--accent);font-weight:700" onclick="location.href=location.pathname">Back to sign in</button> and use "Forgot password?" — the newest email is the one that works.</div>
    </div></div>`;
  }else{
    app.innerHTML=`<div class="auth"><div class="auth-card" style="text-align:center">
      <h3>Confirm your email</h3>
      <div class="auth-err" id="a-err"></div>
      <p style="font-size:13.5px;color:var(--muted);margin:10px 0 18px">One click and you're in.</p>
      <button class="btn accent" style="width:100%;justify-content:center;padding:12px" id="cf-go" onclick="doLinkConfirm()">Confirm &amp; open my workspace</button>
    </div></div>`;
  }
  return true;
}
async function doLinkReset(){
  const pw=$('rp-new').value; if(pw.length<8){authErr('Minimum 8 characters.');return;}
  const b=$('rp-go');b.disabled=true;b.textContent='Saving…';
  try{
    const {data,error}=await sb.auth.verifyOtp({type:'recovery',token_hash:_linkToken});
    if(error)throw new Error('That link has expired or was already used — go back to sign in and request a fresh one (only the newest email works).');
    SESSION=data.session;
    const {error:e2}=await sb.auth.updateUser({password:pw});
    if(e2)throw e2;
    await boot(); toast('🔑 Password updated — welcome back');
  }catch(e){authErr(e.message||String(e));b.disabled=false;b.textContent='Save my new password';}
}
async function doLinkConfirm(){
  const b=$('cf-go');b.disabled=true;b.textContent='Confirming…';
  try{
    const {data,error}=await sb.auth.verifyOtp({type:'magiclink',token_hash:_linkToken});
    if(error)throw new Error('That link has expired or was already used — sign in and press "Resend the email" for a fresh one.');
    SESSION=data.session; await boot(); toast('✅ Email confirmed — welcome!');
  }catch(e){authErr(e.message||String(e));b.disabled=false;b.textContent='Confirm & open my workspace';}
}
(async()=>{
  if(await authLinkCheck())return;
  const {data:{session}}=await sb.auth.getSession();
  SESSION=session;
  billingReturnCheck();
  if(SESSION)await boot(); else render();
  sb.auth.onAuthStateChange((ev,s)=>{
    SESSION=s;
    if(ev==='PASSWORD_RECOVERY'){openModal(`<h3>Set a new password</h3>
      <label>New password (min 8)</label>${pwField('rp-new','new-password',null)}
      <div class="row"><button class="btn accent" onclick="doResetPw()">Save</button></div>`);return;}
    if(!s){WS=null;render();}
  });
})();
async function doResetPw(){
  const pw=$('rp-new').value; if(pw.length<8){toast('Minimum 8 characters');return;}
  try{const {error}=await sb.auth.updateUser({password:pw});if(error)throw error;
  closeModal();await boot();toast('🔑 Password updated');}catch(e){fail(e);}
}

  /* ---------- widget catalog ---------- */
  const CAT = {

    toppost:  {icon:'🏆', name:'Top post',             desc:'Your best-performing published post over the last 30 days.', w:4,h:3},

    trends:   {icon:'#️⃣', name:'Hashtags',             desc:'Your most-used hashtags plus a watchlist of tags to keep an eye on.', w:4,h:4},
    sitehealth:{icon:'🩺', name:'Site health',         desc:'Uptime, response time and SSL-certificate expiry for a website.', w:4,h:3},
    ai:       {icon:'🤖', name:'AI widget',            desc:'Describe anything and AI builds the tile — a routine, live stock/crypto prices, or a summary of your own data.', w:4,h:4}
  };
  const GOAL_SRC = {
    revenue:    {label:'Revenue (this month)',        metric:'revenue',    fmt:money},
    followers:  {label:'Total followers',             metric:'followers',  fmt:numF},
    reach:      {label:'Total reach (30d)',           metric:'reach',      fmt:numF},
    posts:      {label:'Posts published (this month)',metric:'posts',      fmt:numF},
